services:

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────────────────────
  supabase-db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}

    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./docker/supabase/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - mourosub-net

  # ─────────────────────────────────────────────────────────────
  # Supabase Auth (GoTrue)
  # ─────────────────────────────────────────────────────────────
  supabase-auth:
    image: supabase/gotrue:v2.186.0
    restart: unless-stopped

    depends_on:
      supabase-db:
        condition: service_healthy

    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999

      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB}?search_path=auth,public

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}

      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}

      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}

      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@example.com}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailhog}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Mourosub}

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 10

    networks:
      - mourosub-net

  # ─────────────────────────────────────────────────────────────
  # PostgREST
  # ─────────────────────────────────────────────────────────────
  supabase-rest:
    image: postgrest/postgrest:v14.8
    restart: unless-stopped

    depends_on:
      supabase-db:
        condition: service_healthy

    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB}

      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon

      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_EXTRA_SEARCH_PATH: public

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 10

    networks:
      - mourosub-net

  # ─────────────────────────────────────────────────────────────
  # Storage
  # ─────────────────────────────────────────────────────────────
  supabase-storage:
    image: supabase/storage-api:v1.48.26
    restart: unless-stopped

    depends_on:
      supabase-db:
        condition: service_healthy

      supabase-rest:
        condition: service_started

    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}

      AUTH_JWT_SECRET: ${JWT_SECRET}

      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB}

      POSTGREST_URL: http://supabase-rest:3000

      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage

      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}

    volumes:
      - supabase-storage-data:/var/lib/storage

    networks:
      - mourosub-net

  # ─────────────────────────────────────────────────────────────
  # Postgres Meta
  # ─────────────────────────────────────────────────────────────
  supabase-meta:
    image: supabase/postgres-meta:v0.96.3
    restart: unless-stopped

    depends_on:
      supabase-db:
        condition: service_healthy

    environment:
      PG_META_PORT: 8080

      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432

      PG_META_DB_NAME: ${POSTGRES_DB}

      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: grupo3

    networks:
      - mourosub-net

  # ─────────────────────────────────────────────────────────────
  # Supabase Studio
  # ─────────────────────────────────────────────────────────────
  supabase-studio:
    image: supabase/studio:2026.04.27-sha-5f60601
    restart: unless-stopped

    depends_on:
      supabase-meta:
        condition: service_started

    environment:
      HOSTNAME: 0.0.0.0

      STUDIO_PG_META_URL: http://supabase-meta:8080

      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      
      SUPABASE_URL: http://supabase-rest:3000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}

      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

    networks:
      - mourosub-net

  # ─────────────────────────────────────────────────────────────
  # Spring Boot App
  # ─────────────────────────────────────────────────────────────
  springboot-app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      supabase-db:
        condition: service_healthy

      supabase-auth:
        condition: service_started

    environment:
      DB_URL: jdbc:postgresql://supabase-db:5432/${POSTGRES_DB}

      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}

      SERVER_PORT: ${SERVER_PORT}

      JWT_SECRET: ${JWT_SECRET}

      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}

      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}

      ADMIN_EMAIL: ${ADMIN_EMAIL}

      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}

      STATIC_LOCATIONS: file:/app/static/
      THYMELEAF_PREFIX: file:/app/templates/

    volumes:
      - ./src/main/resources/static:/app/static
      - ./src/main/resources/templates:/app/templates

    ports:
      - "${APP_PORT}:${SERVER_PORT}"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${SERVER_PORT}/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    networks:
      - mourosub-net

# ─────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────
volumes:
  supabase-db-data:
  supabase-storage-data:

# ─────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────
networks:
  mourosub-net: