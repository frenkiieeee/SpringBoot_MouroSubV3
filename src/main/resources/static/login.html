<!doctype html>
<html lang="es" class="h-100" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesion | Mourosub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/estilos.css">
  <!-- Supabase SDK debe cargarse ANTES del script principal -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <div id="siteHeader"></div>
  <script src="js/header.js"></script>
  <script>
    fetch("/fragments/header")
      .then(r => r.text())
      .then(html => {
        document.getElementById("siteHeader").innerHTML = html;
        if (window.initHeaderSession) window.initHeaderSession();
      });
  </script>

  <main class="container" style="padding-top: 120px; max-width: 520px;">
    <h1 class="fw-bold mb-3" id="title">Iniciar sesion</h1>
    <p class="text-muted" id="subtitle">Accede con tu cuenta para enviar solicitudes de servicio tecnico.</p>

    <div class="btn-group mb-3" role="group">
      <button id="modeLogin" type="button" class="btn btn-outline-primary active">Iniciar sesion</button>
      <button id="modeRegister" type="button" class="btn btn-outline-primary">Registrarse</button>
    </div>

    <div id="loginError" class="alert alert-danger d-none"></div>
    <div id="loginSuccess" class="alert alert-success d-none"></div>

    <form id="loginForm" class="row g-3">
      <div class="col-12">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" required>
      </div>
      <div class="col-12">
        <label class="form-label">Contrasena</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <div class="col-12">
        <button class="btn btn-primary w-100" type="submit" id="submitBtn">Entrar</button>
      </div>
    </form>

    <!-- Solo se muestra si ya hay sesion activa -->
    <div id="loggedInPanel" class="d-none mt-4">
      <div class="alert alert-info">Ya tienes una sesion activa.</div>
      <button class="btn btn-outline-secondary" type="button" id="logoutBtn">Cerrar sesion</button>
    </div>
  </main>

  <div id="siteFooter"></div>
  <script>
    fetch("/fragments/footer")
      .then(r => r.text())
      .then(html => {
        document.getElementById("siteFooter").innerHTML = html;
      });
  </script>

  <script>
    // Inicializamos Supabase con los valores del entorno via Spring Boot.
    // Esto evita hardcodear URLs o keys en el frontend.
    async function initLogin() {
      const cfg = await fetch("/api/config").then(r => r.json());
      const supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.anonKey);
      setupLoginForm(supabaseClient);
    }

    function setupLoginForm(supabaseClient) {

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const successBox = document.getElementById("loginSuccess");
    const logoutBtn = document.getElementById("logoutBtn");
    const loggedInPanel = document.getElementById("loggedInPanel");
    const modeLogin = document.getElementById("modeLogin");
    const modeRegister = document.getElementById("modeRegister");
    const submitBtn = document.getElementById("submitBtn");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    let mode = "login";

    // Mostrar panel de sesion activa si ya esta logueado
    if (localStorage.getItem("supabaseUserId")) {
      loggedInPanel.classList.remove("d-none");
      form.classList.add("d-none");
      document.querySelector(".btn-group").classList.add("d-none");
      title.textContent = "Sesion activa";
      subtitle.textContent = "Ya has iniciado sesion. Puedes cerrarla o volver al inicio.";
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove("d-none");
      successBox.classList.add("d-none");
    }

    function showSuccess(msg) {
      successBox.textContent = msg;
      successBox.classList.remove("d-none");
      errorBox.classList.add("d-none");
    }

    function setMode(next) {
      mode = next;
      modeLogin.classList.toggle("active", mode === "login");
      modeRegister.classList.toggle("active", mode === "register");
      if (mode === "login") {
        title.textContent = "Iniciar sesion";
        subtitle.textContent = "Accede con tu cuenta para enviar solicitudes de servicio tecnico.";
        submitBtn.textContent = "Entrar";
      } else {
        title.textContent = "Registrarse";
        subtitle.textContent = "Crea tu cuenta para acceder al sistema de tickets.";
        submitBtn.textContent = "Crear cuenta";
      }
    }

    modeLogin.addEventListener("click", () => setMode("login"));
    modeRegister.addEventListener("click", () => setMode("register"));

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      const email = form.email.value.trim();
      const password = form.password.value.trim();
      submitBtn.disabled = true;

      try {
        if (mode === "register") {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) { showError(error.message); return; }
          if (!data?.user?.id) {
            showSuccess("Registro creado. Revisa tu correo si se solicita confirmacion.");
            return;
          }
        } else {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) { showError(error.message); return; }
        }

        const { data } = await supabaseClient.auth.getUser();
        const userId = data?.user?.id;
        const userEmail = data?.user?.email || "";
        if (!userId) { showError("No se pudo obtener el usuario."); return; }

        localStorage.setItem("supabaseUserId", userId);
        localStorage.setItem("supabaseUserEmail", userEmail);

        // Guardamos el token de sesion en una cookie para que el servidor
        // (filtro de Spring) pueda validar el acceso al panel admin
        const { data: sessionData } = await supabaseClient.auth.getSession();
        const accessToken = sessionData?.session?.access_token;
        if (accessToken) {
          document.cookie = "sb_access_token=" + accessToken + "; path=/; max-age=3600; samesite=lax";
        }

        const adminRes = await fetch("/auth/admin-check?supabaseUserId=" + encodeURIComponent(userId));
        const adminPayload = adminRes.ok ? await adminRes.json() : { isAdmin: false };
        localStorage.setItem("supabaseIsAdmin", String(Boolean(adminPayload.isAdmin)));

        showSuccess("Sesion iniciada. Redirigiendo...");
        setTimeout(() => window.location.href = "/cuenta", 800);
      } finally {
        submitBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async function() {
      await supabaseClient.auth.signOut();
      localStorage.removeItem("supabaseUserId");
      localStorage.removeItem("supabaseUserEmail");
      localStorage.removeItem("supabaseIsAdmin");
      document.cookie = "sb_access_token=; path=/; max-age=0";
      showSuccess("Sesion cerrada correctamente. Redirigiendo...");
      setTimeout(() => window.location.href = "/", 800);
    });
    } // fin setupLoginForm

    initLogin();
  </script>
</body>
</html>
