<!doctype html>
<html lang="es" class="h-100" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicios | Mourosub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div id="siteHeader"></div>
  <script src="../../js/header.js"></script>
  <script>
    fetch("/fragments/header")
      .then(r => r.text())
      .then(html => {
        document.getElementById("siteHeader").innerHTML = html;
        document.querySelectorAll("#siteHeader a[href]").forEach(function(a) {
          var href = a.getAttribute("href");
          if (href && !href.startsWith("/") && !href.startsWith("#") && !href.startsWith("http")) {
            a.setAttribute("href", "../../" + href);
          }
        });
        document.querySelectorAll("#siteHeader img[src]").forEach(function(img) {
          var src = img.getAttribute("src");
          if (src && !src.startsWith("/") && !src.startsWith("http")) {
            img.setAttribute("src", "../../" + src);
          }
        });
        if (window.initHeaderSession) window.initHeaderSession();
      });
  </script>

  <main class="container py-5" style="padding-top: 120px;">
    <h1 class="fw-bold mb-4">Servicios</h1>
    <div class="list-group">
      <a href="../../servicios/tecnico" class="list-group-item list-group-item-action">Servicio Tecnico</a>
      <a href="../../page/Cursos/Cursos.html" class="list-group-item list-group-item-action">Cursos</a>
      <a href="../../servicios/alquiler" class="list-group-item list-group-item-action">Alquiler</a>
    </div>
  </main>

  <div id="siteFooter"></div>
  <script>
    fetch("/fragments/footer")
      .then(r => r.text())
      .then(html => {
        document.getElementById("siteFooter").innerHTML = html;
      });
  </script>
</body>
</html>
