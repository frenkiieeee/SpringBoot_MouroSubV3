<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Mi cuenta</title>
</head>
<body>

<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px; max-width: 760px;">
  <h1 class="fw-bold mb-3">Mi cuenta</h1>
  <p class="text-muted">Tu información personal.</p>

  <div id="accountWarning" class="alert alert-warning mt-3 d-none">
    Necesitas iniciar sesión para ver tu cuenta.
  </div>

  <div id="accountError" class="alert alert-danger mt-3 d-none">
    No se pudo cargar tu información personal.
  </div>

  <div id="accountInfo" class="card">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <div class="text-muted small">Nombre</div>
          <div class="fw-semibold" id="accountName">-</div>
        </div>
        <div class="col-md-6">
          <div class="text-muted small">Apellidos</div>
          <div class="fw-semibold" id="accountSurname">-</div>
        </div>
        <div class="col-md-6">
          <div class="text-muted small">Email</div>
          <div class="fw-semibold" id="accountEmail">-</div>
        </div>
        <div class="col-md-6">
          <div class="text-muted small">DNI</div>
          <div class="fw-semibold" id="accountDni">-</div>
        </div>
        <div class="col-md-6">
          <div class="text-muted small">Teléfono</div>
          <div class="fw-semibold" id="accountPhone">-</div>
        </div>
        <div class="col-md-6">
          <div class="text-muted small">Fecha de nacimiento</div>
          <div class="fw-semibold" id="accountBirth">-</div>
        </div>
        <div class="col-md-8">
          <div class="text-muted small">Dirección</div>
          <div class="fw-semibold" id="accountAddress">-</div>
        </div>
        <div class="col-md-4">
          <div class="text-muted small">Código postal</div>
          <div class="fw-semibold" id="accountZip">-</div>
        </div>
        <div class="col-md-6">
          <div class="text-muted small">Localidad</div>
          <div class="fw-semibold" id="accountCity">-</div>
        </div>
        <div class="col-md-6">
          <div class="text-muted small">Rol</div>
          <div class="fw-semibold" id="accountRole">Usuario</div>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex flex-wrap gap-2 mt-3">
    <a id="certBtn" href="/certificados" class="btn btn-outline-primary d-none">
      <i class="bi bi-file-earmark-arrow-up"></i> Subir certificados
    </a>
    <a id="adminPanelBtn" href="/admin" class="btn btn-primary d-none">
      <i class="bi bi-shield-lock"></i> Ir al panel admin
    </a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>
  if (window.initHeaderSession) window.initHeaderSession();

  const userId = localStorage.getItem("supabaseUserId");
  const storedEmail = localStorage.getItem("supabaseUserEmail");
  const isAdmin = localStorage.getItem("supabaseIsAdmin") === "true";

  const accountInfo = document.getElementById("accountInfo");
  const accountWarning = document.getElementById("accountWarning");
  const accountError = document.getElementById("accountError");
  const certBtn = document.getElementById("certBtn");
  const adminPanelBtn = document.getElementById("adminPanelBtn");

  function text(value) {
    return value && String(value).trim() ? value : "-";
  }

  function paintProfile(profile) {
    document.getElementById("accountName").textContent = text(profile.nombre);
    document.getElementById("accountSurname").textContent = text(profile.apellidos);
    document.getElementById("accountEmail").textContent = text(profile.email || storedEmail);
    document.getElementById("accountDni").textContent = text(profile.dni);
    document.getElementById("accountPhone").textContent = text(profile.telefono);
    document.getElementById("accountBirth").textContent = text(profile.fechaNacimiento);
    document.getElementById("accountAddress").textContent = text(profile.direccion);
    document.getElementById("accountZip").textContent = text(profile.codPostal);
    document.getElementById("accountCity").textContent = text(profile.localidad);
    document.getElementById("accountRole").textContent = profile.isAdmin ? "Admin" : "Usuario";

    certBtn.classList.remove("d-none");
    if (profile.isAdmin || isAdmin) adminPanelBtn.classList.remove("d-none");
  }

  async function fetchProfile() {
    const profileResponse = await fetch("/auth/profile?supabaseUserId=" + encodeURIComponent(userId));
    if (profileResponse.ok) {
      return profileResponse.json();
    }

    const bridgeResponse = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ supabaseUserId: userId, email: storedEmail || "" })
    });
    if (bridgeResponse.ok) {
      return bridgeResponse.json();
    }

    const params = new URLSearchParams({ supabaseUserId: userId });
    if (storedEmail) params.append("email", storedEmail);
    const syncResponse = await fetch("/auth/sync?" + params.toString(), { method: "POST" });
    if (syncResponse.ok) {
      return syncResponse.json();
    }

    throw new Error("No se pudo cargar el perfil.");
  }

  async function loadProfile() {
    if (!userId) {
      accountInfo.classList.add("d-none");
      accountWarning.classList.remove("d-none");
      return;
    }

    try {
      const profile = await fetchProfile();
      paintProfile(profile);
    } catch (err) {
      accountInfo.classList.add("d-none");
      accountError.classList.remove("d-none");
    }
  }

  loadProfile();
</script>
</body>
</html>
