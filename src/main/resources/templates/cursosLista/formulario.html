<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title th:text="${curso.idActividad != null} ? 'Editar curso' : 'Nuevo curso'">Formulario de curso</title>
</head>
<body>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 th:text="${curso.idActividad != null} ? 'Editar curso' : 'Nuevo curso'">Nuevo curso</h1>
    <a class="btn btn-secondary" th:href="@{/cursos}">Volver a lista</a>
  </div>

  <form th:action="@{/cursos/guardar}" th:object="${curso}" method="post" class="row g-3 needs-validation" novalidate>
    <input type="hidden" th:field="*{idActividad}"/>

    <div class="col-md-6">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required maxlength="150">
      <div class="invalid-feedback">Introduce el nombre del curso.</div>
    </div>

    <div class="col-md-6">
      <label for="tipo" class="form-label">Tipo</label>
      <input type="text" id="tipo" th:field="*{tipo}" class="form-control" required maxlength="50">
      <div class="invalid-feedback">Introduce el tipo de curso.</div>
    </div>

    <div class="col-md-6">
      <label for="fechaActividad" class="form-label">Fecha</label>
      <input type="date" id="fechaActividad" th:field="*{fechaActividad}" class="form-control" required>
      <div class="invalid-feedback">Selecciona la fecha del curso.</div>
    </div>

    <div class="col-md-6">
      <label for="descripcion" class="form-label">Descripción</label>
      <textarea id="descripcion" th:field="*{descripcion}" class="form-control" rows="4" maxlength="1000"></textarea>
    </div>

    <div class="col-md-4">
      <label for="precio" class="form-label">Precio</label>
      <input type="number" id="precio" th:field="*{precio}" class="form-control" step="0.01" min="0" required>
      <div class="invalid-feedback">Introduce un precio válido.</div>
    </div>

    <div class="col-md-4">
      <label for="duracionMinutos" class="form-label">Duración (min)</label>
      <input type="number" id="duracionMinutos" th:field="*{duracionMinutos}" class="form-control" min="0">
    </div>

    <div class="col-md-4">
      <label for="duracionHoras" class="form-label">Duración (horas)</label>
      <input type="number" id="duracionHoras" th:field="*{duracionHoras}" class="form-control" min="0">
    </div>

    <div class="col-md-4">
      <label for="plazasMax" class="form-label">Plazas máximo</label>
      <input type="number" id="plazasMax" th:field="*{plazasMax}" class="form-control" min="1" required>
      <div class="invalid-feedback">Introduce el número máximo de plazas.</div>
    </div>

    <div class="col-md-4">
      <label for="plazasOcupadas" class="form-label">Plazas ocupadas</label>
      <input type="number" id="plazasOcupadas" th:field="*{plazasOcupadas}" class="form-control" min="0" required>
      <div class="invalid-feedback">Introduce el número de plazas ocupadas.</div>
    </div>

    <div class="col-md-4">
      <label class="form-label d-block">Visible</label>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="activo" th:field="*{activo}">
        <label class="form-check-label" for="activo">Visible</label>
      </div>
    </div>

    <div class="col-md-6">
      <label for="nivelRequerido" class="form-label">Nivel requerido</label>
      <select id="nivelRequerido" th:field="*{nivelRequerido}" class="form-select" required>
        <option value="ninguno">Sin nivel requerido</option>
        <option value="Basico">Básico</option>
        <option value="Medio">Medio</option>
        <option value="Avanzado">Avanzado</option>
      </select>
      <div class="form-text">Selecciona el nivel mínimo exigido para el curso.</div>
    </div>

    <div class="col-12 d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a th:href="@{/cursos}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</main>
<script>
  (function () {
    'use strict';
    const form = document.querySelector('form');

    form.addEventListener('submit', function (event) {
      if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
      }
      form.classList.add('was-validated');
    }, false);
  })();
</script>
</body>
</html>
