<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alquiler de Material | Mourosub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body style="background: linear-gradient(180deg, #08121f 0%, #0b2138 100%);">
<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container py-5" style="padding-top: 120px;">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card bg-dark text-white border-secondary">
        <div class="card-body p-4">
          <h1 class="fw-bold mb-4">Alquilar Material</h1>
          <p class="text-white-50 mb-4">Selecciona el material y las fechas de alquiler.</p>

          <form th:action="@{/alquileres}" th:object="${alquiler}" method="post" class="row g-3">
            <input type="hidden" th:field="*{idAlquiler}">

            <div class="col-12">
              <label class="form-label">Material</label>
              <select class="form-select bg-dark text-white border-secondary" name="materialId" required>
                <option value="">Selecciona material...</option>
                <option th:each="mat : ${materiales}"
                        th:value="${mat.idMaterial}"
                        th:text="${mat.nombre + ' - ' + mat.marca + ' (' + #numbers.formatDecimal(mat.precioPorDia, 1, 2) + ' €/dia)'}">
                </option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Fecha de devolucion</label>
              <input type="date" class="form-control bg-dark text-white border-secondary" th:field="*{fechaDevolucion}" required>
            </div>

            <div class="col-12 mt-4">
              <button type="submit" class="btn btn-primary w-100">Confirmar alquiler</button>
              <a th:href="@{/materiales}" class="btn btn-outline-light w-100 mt-2">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="siteFooter" th:insert="~{Fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
