<!doctype html>
<html lang="es" class="h-100" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alquiler de Material | Mourosub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body class="form-page">
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main style="padding-top: 120px;">
  <div class="form-section">
    <p class="hero-label">NUEVO ALQUILER</p>
    <h2 class="form-title">Alquilar material</h2>
    <p class="form-subtitle">Selecciona el material y la fecha de devolucion.</p>

    <form id="alquilerForm" th:action="@{/alquileres}" th:object="${alquiler}" method="post">
      <input type="hidden" th:field="*{idAlquiler}">
      <input type="hidden" name="supabaseUserId" id="supabaseUserId">

      <div class="form-group">
        <label for="al-material">Material</label>
        <select id="al-material" name="materialId" required>
          <option value="">Selecciona material...</option>
          <option th:each="mat : ${materiales}"
                  th:value="${mat.idMaterial}"
                  th:text="${mat.nombre + ' - ' + mat.marca + ' (' + #numbers.formatDecimal(mat.precioPorDia, 1, 2) + ' €/dia)'}">
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="al-devolucion">Fecha de devolucion</label>
        <input id="al-devolucion" type="date" th:field="*{fechaDevolucion}" required>
      </div>

      <button type="submit" class="btn-submit">
        <i class="bi bi-check-circle"></i> Confirmar alquiler
      </button>
    </form>

    <a th:href="@{/materiales}" class="btn-volver">← Cancelar</a>
  </div>
</main>

<div id="siteFooter" th:insert="~{fragments/footerBlack :: footerBlack}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script src="/js/login-required.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
<script>
  // Si hay sesion la ponemos en el campo hidden; el envio se valida con el popup global.
  (function () {
    const storedUserId = localStorage.getItem("supabaseUserId") || "";
    const form = document.getElementById("alquilerForm");
    const supabaseInput = document.getElementById("supabaseUserId");
    if (storedUserId && supabaseInput) supabaseInput.value = storedUserId;
    if (form) {
      form.addEventListener("submit", function (e) {
        if (!window.requireLogin()) e.preventDefault();
      });
    }
  })();
</script>
</body>
</html>
