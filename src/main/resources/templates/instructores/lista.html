<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instructores | Mourosub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="text-center mb-5">
    <h1 class="fw-bold">Instructores</h1>
    <p class="text-muted">Equipo profesional de Mourosub.</p>
  </div>

  <div class="row g-4" th:if="${not #lists.isEmpty(instructores)}">
    <div class="col-12 col-md-6 col-lg-4" th:each="instructor : ${instructores}">
      <div class="card h-100">
        <div class="card-body">
          <h3 class="card-title h5" th:text="${instructor.nombre}">Nombre</h3>
          <p class="text-muted small" th:text="${instructor.dni}">DNI</p>
          <p class="card-text" th:text="${instructor.certificaciones}">Certificaciones</p>
        </div>
      </div>
    </div>
  </div>

  <div class="text-center py-5" th:if="${#lists.isEmpty(instructores)}">
    <p class="text-muted">No hay instructores disponibles.</p>
  </div>

  <div class="text-center mt-4">
    <a class="btn btn-outline-primary" th:href="@{/}">Volver al inicio</a>
  </div>
</main>

<div id="siteFooter" th:insert="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
