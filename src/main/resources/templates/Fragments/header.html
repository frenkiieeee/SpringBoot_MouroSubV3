<!-- ================================================================
     FRAGMENTO: cabecera del sitio (header).
     th:fragment="siteHeader" le pone NOMBRE a este trozo de HTML.
     Asi cualquier pagina puede insertarlo con th:insert sin repetir
     el codigo: header y footer se escriben una sola vez aqui.
     ================================================================ -->
<!-- Contenedor principal del header -->
<div th:fragment="siteHeader" class="header">
    <!-- Barra superior con logo, navegacion y acciones -->
    <header>
        <!-- Logo principal -->
        <a href="index.html" th:href="@{/index.html}" class="header-logo">
            <img src="img/Logo/letrasylogo2.png" th:src="@{/img/Logo/letrasylogo2.png}" alt="Mourosub">
        </a>

        <!-- Navegacion escritorio (solo visible en desktop) -->
        <div class="header-pill d-none d-md-inline-flex">
            <ul class="header-links">
                <li><a href="page/actividades/index.html" th:href="@{/page/actividades/index.html}">Actividades</a></li>
                <li><a href="page/inmersiones/index.html" th:href="@{/page/inmersiones/index.html}">Inmersiones</a></li>
                <li><a href="page/Cursos/Cursos.html" th:href="@{/page/Cursos/Cursos.html}">Cursos</a></li>
                <li><a href="page/servicios/index.html" th:href="@{/page/servicios/index.html}">Servicios</a></li>
            </ul>
        </div>

        <!-- Botones derecha (login/usuario) -->
        <div class="header-right">

            <!-- Login: visible cuando NO hay sesion. header.js lo oculta si hay sesion. -->
            <a id="loginLink" href="/login" th:href="@{/login}" class="btn-reservar d-none">Iniciar sesion / Registrarse</a>
            <a id="loginLink" href="/login" th:href="@{/login}" class="btn-reservar d-none d-md-inline-flex">Iniciar sesion / Registrarse</a>

            <!-- Menu de usuario: oculto por defecto (d-none); header.js lo muestra si hay sesion -->
            <div id="userMenu" class="dropdown d-none d-md-inline-flex">

                <!-- Boton con icono de usuario; data-bs-toggle="dropdown" lo gestiona Bootstrap -->
                <button class="btn-reservar dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-display="static"
                    aria-expanded="false">
                    <i class="bi bi-person-circle"></i>
                </button>

                <!-- Opciones del menu de usuario -->
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenuDropdown">
                    <!-- Acceso a cuenta -->
                    <li><a class="dropdown-item" href="/cuenta">Ver mi cuenta</a></li>
                    <!-- Acceso al panel admin (header.js lo oculta si el usuario no es admin) -->
                    <li><a id="adminLink" class="dropdown-item" href="/admin">Panel admin</a></li>
                    <!-- Cierre de sesion (lo maneja header.js) -->
                    <li><button class="dropdown-item" type="button" id="logoutBtn">Cerrar sesion</button></li>
                </ul>
            </div>

            <!-- Boton hamburguesa para movil: abre/cierra el menu #menuMovil -->
            <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#menuMovil"
                aria-controls="menuMovil" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </header>

    <!-- Menu movil (colapsable): solo se ve en pantallas pequenyas -->
    <div class="collapse d-md-none" id="menuMovil">

        <!-- Navegacion movil con enlaces y acciones -->
        <nav class="menu-movil">
            <ul>
                <li><a href="page/actividades/index.html" th:href="@{/page/actividades/index.html}">Actividades</a></li>
                <li><a href="page/inmersiones/index.html" th:href="@{/page/inmersiones/index.html}">Inmersiones</a></li>
                <li><a href="page/Cursos/Cursos.html" th:href="@{/page/Cursos/Cursos.html}">Cursos</a></li>
                <li><a href="page/servicios/index.html" th:href="@{/page/servicios/index.html}">Servicios</a></li>
                <li><a id="loginLinkMobile" href="/login" th:href="@{/login}">Iniciar sesion / Registrarse</a></li>
            </ul>
        </nav>
    </div>
</div>
