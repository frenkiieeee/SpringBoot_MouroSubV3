<!DOCTYPE html>
<html lang="es" class="h-100" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<!--Hacer thymeleaf de reservas y corregir posibles errores-->

<head>
    <meta charset="UTF-8">
    <title>Reservas</title>
    <link rel="stylesheet" href="src\main\resources\static\css\estilos.css">
</head>

<body>
    <section th:if="${seccion == 'inicio'}">
    <h1>Reservas</h1>
    
        <!-- Card Bautismos y Cursos -->
        <a th:href="@{/reservas/cursos}" class="card">
            <!--En el th:src, ira la imagen que querramos mostrar en la card-->
            <img class="card-img" 
                 src="img/Cursos/598-10.png"
                 alt="Bautismo de buceo">
            <div class="card-overlay"></div>
            <div class="card-content">
                <div class="badge badge-cyan">⭐ PRINCIPIANTES</div>
                <div class="card-title">Bautismos de<br>Buceo</div>
                <span class="card-btn card-btn-cyan">RESERVAR BAUTISMO →</span>
            </div>
        </a>

        <article>
            <h2>Actividades</h2>
            <p>Reserva de inmersiones, snorkel y muchas mas por descubrir</p>
            <a th:href="@{/reservas/actividades}">Reserva actividad</a>
        </article>
    </section>
    <!--========== Forumulario de actividades ===============-->
    <section th:if="${seccion == 'formulario'}">
        <h2 th:text="${titulo}">Nueva reserva - Actividad</h2>
        <form action="@{/reservas/guardar}" method="post">

            <label for="idActividad">Actividades</label>
            <select id="idActividad" name="idActividad" required>
                <option value="">Seleccione una opcion</option>
                <option value="">snorkel y buceo</option>
                <option value="">Vela, piragua y kayak</option>
                <option value="">Paddle surf</option>
                <option value="">Surf y Windsurf</option>
                <option value="">Motos de agua y rutas en barco</option>
                <option th:each="actividad : ${actividades}" 
                        th:value="${actividad.idActividad}"
                        th:text="${actividad.nombre + ' - ' + actividad.tipo + ' - ' + actividad.precio + ' €'}">
                </option>
            </select>
            <br>
            <label for="Act-nombre">Nombre</label>
            <input id="Act-nombre" type="text" name="nombre" required>

            <label for="Act-apellidos">Apellidos</label>
            <input id="Act-apellidos" type="text" name="apellidos" required>

            <label for="Act-email">Email</label>
            <input id="Act-email" type="email" name="email" required>

            <label for="Act-telefono">Telefono</label>
            <input id="Act-telefono" type="text" name="telefono" required>

            <label for="Act-dni">DNI</label>
            <input id="Act-dni" type="text" name="dni">

            <label for="Act-CodigoPostal">Codigo postal</label>
            <input id="Act-CodigoPostal" type="text" name="codigoPostal">

            <label for="Act-numParticipantes">Indique el numero de participantes</label>
            <input id="Act-numParticipantes" type="number" name="numParticipantes" min="1" required>
            <button type="submit">Guardar reserva</button>
        </form>
        <a th:href="@{/reservas}">Volver</a>
    </section>

    <section th:if="${seccion == 'cursos'}">
        <h2 th:text="${titulo}">Nueva reserva - Curso</h2>
        <form th:action="@{/reservas/guardar}" method="post">

            <label for="idCurso">Cursos</label>
            <select id="idCurso" name="idCurso" required>
                <option value=""></option>
                <option value="">Cursos de apnea</option>
                <option value="">Cursos Deportivos y Especialidad</option>
                <option value="">Formacion de Emergencia y Primeros Auxilios</option>
                <option value="">Técnicos XR</option>
                <option value="">Profesionales</option>
                <option th:each="curso : ${cursos}" 
                        th:value="${curso.idCurso}"
                        th:text="${curso.nombre + ' - ' + curso.tipo + ' - ' + curso.precio + ' €'}">

                </option>
            </select>
            <br>
            <label for="Act-nombre">Nombre</label>
            <input id="Act-nombre" type="text" name="nombre" required>

            <label for="Act-apellidos">Apellidos</label>
            <input id="Act-apellidos" type="text" name="apellidos" required>

            <label for="Act-email">Email</label>
            <input id="Act-email" type="email" name="email" required>

            <label for="Act-telefono">Telefono</label>
            <input id="Act-telefono" type="text" name="telefono" required>

            <label for="cur-dni">DNI</label>
            <input id="cur-dni" type="text" name="dni">



            <button type="submit">Guardar reserva</button>
        </form>
        <a th:href="@{/reservas}">Volver</a>
    </section>
    <script>
        // cargar cabecera con control de errores
        fetch("/fragments/header")
            .then(r => {
                if (!r.ok) throw new Error("Error al cargar header: " + r.status);
                return r.text();
            })
            .then(html => {
                document.getElementById("siteHeader").innerHTML = html;
                if (window.initHeaderSession) window.initHeaderSession();
            })
            .catch(err => console.error(err));

        // cargar pie de pagina con control de errores
        fetch("/fragments/footerBlack")
            .then(r => {
                if (!r.ok) throw new Error("Error al cargar footer: " + r.status);
                return r.text();
            })
            .then(html => {
                document.getElementById("siteFooter").innerHTML = html;
            })
            .catch(err => console.error(err));
    </script>
</body>

</html>
