<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Ticket</title>
</head>
<body class="plain-page">

<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px; max-width: 900px;">
  <div class="mb-3">
    <a class="btn btn-link" th:href="@{/tickets/admin/tickets}">&larr; Volver a tickets</a>
  </div>

  <!-- Datos del ticket -->
  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0">Ticket #<span th:text="${ticket.idTicket}">1</span></h4>
      <span th:if="${ticket.estado == 'ABIERTO'}" class="badge bg-danger">Abierto</span>
      <span th:if="${ticket.estado == 'EN_PROCESO'}" class="badge bg-warning text-dark">En proceso</span>
      <span th:if="${ticket.estado == 'CERRADO'}" class="badge bg-success">Cerrado</span>
    </div>
    <div class="card-body">
      <p class="mb-2"><strong>Usuario:</strong> <span th:text="${ticket.usuario.email}">email@test.com</span></p>
      <p class="mb-2"><strong>Asunto:</strong> <span th:text="${ticket.asunto}">Asunto</span></p>
      <p class="mb-2"><strong>Descripcion:</strong></p>
      <p th:text="${ticket.descripcion}" class="text-muted">Descripcion del ticket</p>
      <p class="mb-0"><strong>Creado:</strong> <span th:text="${#temporals.format(ticket.fechaCreacion, 'yyyy-MM-dd HH:mm')}">Fecha</span></p>
    </div>
  </div>

  <!-- Cambiar estado del ticket -->
  <div class="card mb-4">
    <div class="card-header">
      <h5 class="mb-0">Cambiar estado</h5>
    </div>
    <div class="card-body">
      <form th:action="@{/tickets/admin/tickets/{id}/estado(id=${ticket.idTicket})}" method="post" class="d-flex gap-2">
        <select name="estado" class="form-select" style="max-width: 200px;">
          <option th:each="e : ${estados}" th:value="${e}" th:text="${e}" th:selected="${e == ticket.estado}">Estado</option>
        </select>
        <button type="submit" class="btn btn-primary">Actualizar</button>
      </form>
    </div>
  </div>

  <!-- Hilo de respuestas -->
  <div class="card mb-4">
    <div class="card-header">
      <h5 class="mb-0">Respuestas</h5>
    </div>
    <div class="card-body">
      <div th:each="resp : ${respuestas}" class="mb-3 p-3 rounded" th:classappend="${resp.esAdmin ? 'bg-light border' : 'bg-white border'}">
        <div class="d-flex justify-content-between mb-2">
          <strong>
            <span th:if="${resp.esAdmin}" class="text-danger">Admin</span>
            <span th:unless="${resp.esAdmin}" th:text="${resp.usuario.email}">Usuario</span>
          </strong>
          <small class="text-muted" th:text="${#temporals.format(resp.fechaCreacion, 'yyyy-MM-dd HH:mm')}">Fecha</small>
        </div>
        <p class="mb-0" th:text="${resp.contenido}">Contenido</p>
      </div>
      <div th:if="${#lists.isEmpty(respuestas)}" class="text-muted">No hay respuestas aun</div>
    </div>
  </div>

  <!-- Formulario para nueva respuesta -->
  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">Nueva respuesta</h5>
    </div>
    <div class="card-body">
      <form th:action="@{/tickets/admin/tickets/{id}/responder(id=${ticket.idTicket})}" method="post">
        <div class="mb-3">
          <textarea name="contenido" class="form-control" rows="4" placeholder="Escribe tu respuesta..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Enviar respuesta</button>
      </form>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>

</body>
</html>
