<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Tickets</title>
</head>
<body>

<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold">Tickets</h1>
    <a class="btn btn-link" th:href="@{/admin}">Volver al admin</a>
  </div>

  <!-- Lista de tickets en tabla -->
  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Asunto</th>
        <th>Estado</th>
        <th>Fecha creacion</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="ticket : ${tickets}">
        <td th:text="${ticket.idTicket}">1</td>
        <td th:text="${ticket.usuario.email}">email@test.com</td>
        <td th:text="${ticket.asunto}">Asunto</td>
        <td>
          <span th:if="${ticket.estado == 'ABIERTO'}" class="badge bg-danger">Abierto</span>
          <span th:if="${ticket.estado == 'EN_PROCESO'}" class="badge bg-warning text-dark">En proceso</span>
          <span th:if="${ticket.estado == 'CERRADO'}" class="badge bg-success">Cerrado</span>
        </td>
        <td th:text="${#temporals.format(ticket.fechaCreacion, 'yyyy-MM-dd HH:mm')}">Fecha</td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/tickets/admin/tickets/{id}(id=${ticket.idTicket})}">Ver</a>
          <a class="btn btn-sm btn-outline-danger" th:href="@{/tickets/admin/tickets/eliminar/{id}(id=${ticket.idTicket})}">Eliminar</a>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(tickets)}">
        <td colspan="6" class="text-center">No hay tickets</td>
      </tr>
    </tbody>
  </table>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>

</body>
</html>
