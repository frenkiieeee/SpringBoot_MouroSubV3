<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Ticket</title>
</head>
<body class="plain-page">

<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px; max-width: 900px;">
  <div class="mb-3">
    <a class="btn btn-link" th:href="@{/tickets/mis-tickets(supabaseUserId=${supabaseUserId})}">&larr; Volver a Mis tickets</a>
  </div>

  <!-- Datos del ticket -->
  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0" th:text="${ticket.asunto}">Asunto</h4>
      <span th:if="${ticket.estado == 'ABIERTO'}" class="badge bg-danger">Abierto</span>
      <span th:if="${ticket.estado == 'EN_PROCESO'}" class="badge bg-warning text-dark">En proceso</span>
      <span th:if="${ticket.estado == 'CERRADO'}" class="badge bg-success">Cerrado</span>
    </div>
    <div class="card-body">
      <p class="text-muted" th:text="${ticket.descripcion}">Descripcion</p>
      <small class="text-muted">Creado: <span th:text="${#temporals.format(ticket.fechaCreacion, 'yyyy-MM-dd HH:mm')}">Fecha</span></small>
    </div>
  </div>

  <!-- Hilo de respuestas -->
  <h5 class="mb-3">Respuestas</h5>
  <div class="list-group mb-4">
    <div class="list-group-item" th:each="resp : ${respuestas}">
      <div class="d-flex justify-content-between mb-2">
        <strong>
          <span th:if="${resp.esAdmin}" class="text-danger">Admin</span>
          <span th:unless="${resp.esAdmin}" th:text="${resp.usuario.email}">Usuario</span>
        </strong>
        <small class="text-muted" th:text="${#temporals.format(resp.fechaCreacion, 'yyyy-MM-dd HH:mm')}">Fecha</small>
      </div>
      <p class="mb-0" th:text="${resp.contenido}">Contenido</p>
    </div>
    <div class="list-group-item text-muted" th:if="${#lists.isEmpty(respuestas)}">
      No hay respuestas aun
    </div>
  </div>

  <!-- Formulario para nueva respuesta -->
  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">Nueva respuesta</h5>
    </div>
    <div class="card-body">
      <form th:action="@{/tickets/mis-tickets/{id}/responder(id=${ticket.idTicket})}" method="post">
        <input type="hidden" name="supabaseUserId" th:value="${supabaseUserId}" />
        <div class="mb-3">
          <textarea name="contenido" class="form-control" rows="3" placeholder="Escribe tu respuesta..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
      </form>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>

</body>
</html>
