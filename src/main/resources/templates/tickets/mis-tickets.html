<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Mis tickets</title>
</head>
<body>

<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px; max-width: 900px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold">Mis tickets</h1>
    <a class="btn btn-primary" th:href="@{/tickets/mis-tickets/nuevo(supabaseUserId=${supabaseUserId})}">
      <i class="bi bi-plus-circle"></i> Nuevo ticket
    </a>
  </div>

  <!-- Mensaje si no hay tickets -->
  <div class="alert alert-warning" th:if="${#lists.isEmpty(tickets)}">
    No tienes tickets abiertos.
  </div>

  <!-- Lista de tickets del usuario -->
  <div class="list-group">
    <a class="list-group-item list-group-item-action" th:each="ticket : ${tickets}"
       th:href="@{/tickets/mis-tickets/{id}(id=${ticket.idTicket}, supabaseUserId=${supabaseUserId})}">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong th:text="${ticket.asunto}">Asunto</strong>
          <p class="mb-0 text-muted small" th:text="${ticket.descripcion}">Descripcion</p>
        </div>
        <div class="text-end">
          <span th:if="${ticket.estado == 'ABIERTO'}" class="badge bg-danger">Abierto</span>
          <span th:if="${ticket.estado == 'EN_PROCESO'}" class="badge bg-warning text-dark">En proceso</span>
          <span th:if="${ticket.estado == 'CERRADO'}" class="badge bg-success">Cerrado</span>
          <br>
          <small class="text-muted" th:text="${#temporals.format(ticket.fechaCreacion, 'yyyy-MM-dd HH:mm')}">Fecha</small>
        </div>
      </div>
    </a>
  </div>

  <div class="mt-3">
    <a class="btn btn-link" th:href="@{/cuenta}">Volver a Mi cuenta</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>

</body>
</html>
