<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alquiler de Material | Mourosub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body style="background: linear-gradient(180deg, #08121f 0%, #0b2138 100%);">
<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container py-5" style="padding-top: 120px;">
  <div class="text-center mb-5">
    <p class="text-uppercase text-primary mb-2 small">Alquiler</p>
    <h1 class="fw-bold text-white">Material de Buceo</h1>
    <p class="text-white-50">Equipo completo de las mejores marcas, revisado y certificado.</p>
  </div>

  <div class="row g-4" th:if="${not #lists.isEmpty(materiales)}">
    <div class="col-12 col-md-6 col-lg-4" th:each="material : ${materiales}">
      <div class="card h-100 bg-dark text-white border-secondary">
        <div class="card-body">
          <span class="badge bg-primary mb-2" th:text="${material.categoria}">Categoria</span>
          <h3 class="card-title h5 text-white" th:text="${material.nombre}">Nombre</h3>
          <p class="text-white-50 small mb-2" th:text="${material.marca + ' ' + material.modelo}">Marca Modelo</p>
          <ul class="list-unstyled text-white-50 small">
            <li><i class="bi bi-check2-circle text-primary me-2"></i><span th:text="${material.estadoConservacion}">Estado</span></li>
            <li><i class="bi bi-hash me-2 text-primary"></i><span th:text="${material.numSerie}">NumSerie</span></li>
          </ul>
          <div class="mt-3 p-3 bg-primary bg-opacity-10 border rounded">
            <span class="text-primary fw-bold h4" th:text="${#numbers.formatDecimal(material.precioPorDia, 1, 2) + ' €'}">0.00 €</span>
            <span class="text-white-50 small"> / dia</span>
          </div>
        </div>
        <div class="card-footer bg-dark border-secondary">
          <a th:href="@{/alquileres/nuevo}" class="btn btn-outline-light w-100">Reservar</a>
        </div>
      </div>
    </div>
  </div>

  <div class="text-center py-5" th:if="${#lists.isEmpty(materiales)}">
    <p class="text-white-50">No hay material disponible en estos momentos.</p>
  </div>

  <div class="text-center mt-5">
    <a th:href="@{/servicios/alquiler}" class="btn btn-outline-light">Volver a Alquileres y Seguros</a>
  </div>
</main>

<div id="siteFooter" th:insert="~{Fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
