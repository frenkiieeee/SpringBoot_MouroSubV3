<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Materiales</title>
</head>
<body>
<!-- Header/Navegación -->
<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <!-- Encabezado con título y botón Nuevo -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="fw-bold">Materiales</h1>
    <a class="btn btn-primary" th:href="@{/materiales/nuevo}">Nuevo</a>
  </div>

  <!-- Tabla con lista de materiales -->
  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Modelo</th>
        <th>Marca</th>
        <th>Nº Serie</th>
        <th>Estado</th>
        <th>Precio/día</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <!-- Una fila por cada material -->
      <tr th:each="material : ${materiales}">
        <td th:text="${material.nombre}">Nombre</td>
        <td th:text="${material.categoria}">Categoría</td>
        <td th:text="${material.modelo}">Modelo</td>
        <td th:text="${material.marca}">Marca</td>
        <td th:text="${material.numSerie}">Nº</td>
        <td th:text="${material.estadoConservacion}">Estado</td>
        <td th:text="${#numbers.formatDecimal(material.precioPorDia, 1, 2)}">0.00€</td>
        <td class="text-end">
          <!-- Botón Editar -->
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/materiales/editar/{id}(id=${material.idMaterial})}">Editar</a>
          <!-- Botón Eliminar (en formulario porque es POST) -->
          <form th:action="@{/materiales/eliminar/{id}(id=${material.idMaterial})}" method="post" class="d-inline">
            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Botón volver -->
  <a class="btn btn-link" th:href="@{/materiales}">Volver a la lista</a>
</main>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
