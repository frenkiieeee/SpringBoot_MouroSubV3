<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title th:text="${material.idMaterial != null} ? 'Editar material' : 'Nuevo material'">Formulario de material</title>
</head>
<body>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 th:text="${material.idMaterial != null} ? 'Editar material' : 'Nuevo material'">Nuevo material</h1>
    <a class="btn btn-secondary" th:href="@{/materiales}">Volver a lista</a>
  </div>

  <form th:action="@{/materiales/guardar}" th:object="${material}" method="post" class="row g-3 needs-validation" novalidate>
    <input type="hidden" th:field="*{idMaterial}"/>

    <div class="col-md-6">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required maxlength="150">
      <div class="invalid-feedback">Introduce el nombre del material.</div>
    </div>

    <div class="col-md-6">
      <label for="categoria" class="form-label">Categoría</label>
      <input type="text" id="categoria" th:field="*{categoria}" class="form-control" required maxlength="100">
      <div class="invalid-feedback">Introduce la categoría del material.</div>
    </div>

    <div class="col-md-6">
      <label for="modelo" class="form-label">Modelo</label>
      <input type="text" id="modelo" th:field="*{modelo}" class="form-control" required maxlength="50">
      <div class="invalid-feedback">Introduce el modelo.</div>
    </div>

    <div class="col-md-6">
      <label for="marca" class="form-label">Marca</label>
      <input type="text" id="marca" th:field="*{marca}" class="form-control" required maxlength="50">
      <div class="invalid-feedback">Introduce la marca.</div>
    </div>

    <div class="col-md-6">
      <label for="numSerie" class="form-label">Número de serie</label>
      <input type="text" id="numSerie" th:field="*{numSerie}" class="form-control" required maxlength="50">
      <div class="invalid-feedback">Introduce el número de serie.</div>
    </div>

    <div class="col-md-6">
      <label for="estadoConservacion" class="form-label">Estado de conservación</label>
      <input type="text" id="estadoConservacion" th:field="*{estadoConservacion}" class="form-control" required maxlength="100">
      <div class="invalid-feedback">Describe el estado del material.</div>
    </div>

    <div class="col-md-6">
      <label for="precioBase" class="form-label">Precio base</label>
      <input type="number" id="precioBase" th:field="*{precioBase}" class="form-control" step="0.01" min="0" required>
      <div class="invalid-feedback">Introduce un precio base válido.</div>
    </div>

    <div class="col-md-6">
      <label for="precioPorDia" class="form-label">Precio por día</label>
      <input type="number" id="precioPorDia" th:field="*{precioPorDia}" class="form-control" step="0.01" min="0" required>
      <div class="invalid-feedback">Introduce un precio por día válido.</div>
    </div>

    <div class="col-12 d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a th:href="@{/materiales}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</main>

<script>
  (function () {
    'use strict';
    const form = document.querySelector('form');

    form.addEventListener('submit', function (event) {
      if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
      }
      form.classList.add('was-validated');
    }, false);
  })();
</script>
</body>
</html>
