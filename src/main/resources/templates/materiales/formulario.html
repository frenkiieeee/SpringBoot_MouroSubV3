<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title th:text="${material.idMaterial != null} ? 'Editar Material' : 'Nuevo Material'">Formulario</title>
</head>
<body class="plain-page">
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          <h1 class="fw-bold mb-4" th:text="${material.idMaterial != null} ? 'Editar Material' : 'Nuevo Material'">Formulario</h1>

          <form th:action="@{/materiales/guardar}" th:object="${material}" method="post" class="row g-3">
            <input type="hidden" th:field="*{idMaterial}"/>

            <div class="col-md-6">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" th:field="*{nombre}" required maxlength="150">
            </div>

            <div class="col-md-6">
              <label class="form-label">Categoria</label>
              <input type="text" class="form-control" th:field="*{categoria}" required maxlength="100">
            </div>

            <div class="col-md-6">
              <label class="form-label">Modelo</label>
              <input type="text" class="form-control" th:field="*{modelo}" required maxlength="50">
            </div>

            <div class="col-md-6">
              <label class="form-label">Marca</label>
              <input type="text" class="form-control" th:field="*{marca}" required maxlength="50">
            </div>

            <div class="col-12">
              <label class="form-label">Numero de serie</label>
              <input type="text" class="form-control" th:field="*{numSerie}" required maxlength="50">
            </div>

            <div class="col-md-4">
              <label class="form-label">Estado de conservacion</label>
              <input type="text" class="form-control" th:field="*{estadoConservacion}" required maxlength="100">
            </div>

            <div class="col-md-4">
              <label class="form-label">Precio base</label>
              <input type="number" step="0.01" class="form-control" th:field="*{precioBase}" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Precio por dia</label>
              <input type="number" step="0.01" class="form-control" th:field="*{precioPorDia}" required>
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-primary">Guardar</button>
              <a class="btn btn-secondary" th:href="@{/materiales}">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="siteFooter" th:insert="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
