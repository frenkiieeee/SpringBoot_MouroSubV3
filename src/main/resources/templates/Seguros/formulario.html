<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title th:text="${seguro.idSeguro != null} ? 'Editar Seguro' : 'Nuevo Seguro'">Formulario</title>
</head>
<body class="plain-page">
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          <h1 class="fw-bold mb-4" th:text="${seguro.idSeguro != null} ? 'Editar Seguro' : 'Nuevo Seguro'">Formulario</h1>

          <form th:action="@{/seguros/guardar}" th:object="${seguro}" method="post" class="row g-3">
            <input type="hidden" th:field="*{idSeguro}"/>

            <div class="col-md-6">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" th:field="*{nombre}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Compania</label>
              <input type="text" class="form-control" th:field="*{compania}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Cobertura de gastos</label>
              <input type="number" step="0.01" class="form-control" th:field="*{coberturaGastos}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Activo</label>
              <select class="form-select" th:field="*{activo}">
                <option value="true">Si</option>
                <option value="false">No</option>
              </select>
            </div>

            <div class="col-12">
              <label class="form-label">Descripcion</label>
              <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-primary">Guardar</button>
              <a class="btn btn-secondary" th:href="@{/seguros}">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="siteFooter" th:insert="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
