<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguros - Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${segurosForm.idSeguro != null} ? 'Editar seguro' : 'Nuevo seguro'">Nuevo seguro</h2>
        <a th:href="@{/seguros}" class="btn btn-secondary">Volver a lista</a>
    </div>

    <form th:action="@{/seguros/guardar}" th:object="${segurosForm}" method="post">

        <input type="hidden" th:field="*{idSeguro}">

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="tipo" class="form-label">Tipo</label>
                <input type="text" id="tipo" th:field="*{tipo}" class="form-control">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="compania" class="form-label">Compañía</label>
                <input type="text" id="compania" th:field="*{compania}" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="numeroPoliza" class="form-label">Número de póliza</label>
                <input type="text" id="numeroPoliza" th:field="*{numeroPoliza}" class="form-control">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="prima" class="form-label">Prima (€)</label>
                <input type="number" id="prima" th:field="*{prima}" class="form-control" step="0.01" min="0">
            </div>
            <div class="col-md-6">
                <label for="descripcion" class="form-label">Descripción</label>
                <input type="text" id="descripcion" th:field="*{descripcion}" class="form-control">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="fechaInicio" class="form-label">Fecha de inicio</label>
                <input type="date" id="fechaInicio" th:field="*{fechaInicio}" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="fechaVencimiento" class="form-label">Fecha de vencimiento</label>
                <input type="date" id="fechaVencimiento" th:field="*{fechaVencimiento}" class="form-control">
            </div>
        </div>

        <div class="mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="activo" th:field="*{activo}">
                <label class="form-check-label" for="activo">Activo</label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/seguros}" class="btn btn-secondary ms-2">Cancelar</a>

    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
