<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h2 class="fw-bold mb-1">Seguros</h2>
            <p class="text-muted mb-0">Gestión de seguros registrados en el sistema.</p>
        </div>
        <a th:href="@{/seguros/nuevo}" class="btn btn-primary">Nuevo seguro</a>
    </div>

    <table class="table table-hover align-middle">
        <thead class="border-bottom border-top">
            <tr>
                <th>Nombre</th>
                <th>Compañía</th>
                <th>Tipo</th>
                <th>Prima</th>
                <th>Fecha inicio</th>
                <th>Activo</th>
                <th class="text-end">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="seguro : ${seguros}">
                <td th:text="${seguro.nombre}"></td>
                <td th:text="${seguro.compania}"></td>
                <td th:text="${seguro.tipo}"></td>
                <td th:text="${#numbers.formatDecimal(seguro.prima, 1, 2)} + ' €'"></td>
                <td th:text="${seguro.fechaInicio}"></td>
                <td th:text="${seguro.activo} ? 'Sí' : 'No'"></td>
                <td class="text-end">
                    <a th:href="@{/seguros/editar/{id}(id=${seguro.idSeguro})}"
                       class="btn btn-sm btn-outline-secondary me-1">Editar</a>
                    <a th:href="@{/seguros/eliminar/{id}(id=${seguro.idSeguro})}"
                       class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('¿Eliminar este seguro?')">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(seguros)}">
                <td colspan="7" class="text-center text-muted py-3">No hay seguros registrados aún.</td>
            </tr>
        </tbody>
    </table>

    <hr>
    <a th:href="@{/}" class="text-decoration-underline">Volver al inicio</a>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
