<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seguros | Mourosub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="plain-page">
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container py-5" style="padding-top: 120px;">
  <div class="text-center mb-5">
    <p class="text-uppercase text-info mb-2 small">Proteccion</p>
    <h1 class="fw-bold text-white">Seguros de Buceo</h1>
    <p class="text-white-50">Coberturas internacionales y asistencia medica especializada.</p>
  </div>

  <div class="row g-4 justify-content-center" th:if="${not #lists.isEmpty(seguros)}">
    <div class="col-12 col-md-6 col-lg-4" th:each="seguro : ${seguros}">
      <div class="card h-100 bg-dark text-white border-secondary">
        <div class="card-body">
          <span class="badge bg-info mb-2" th:text="${seguro.activo} ? 'Activo' : 'Inactivo'">Activo</span>
          <h3 class="card-title h5 text-white" th:text="${seguro.nombre}">Nombre</h3>
          <p class="text-white-50 small mb-2" th:text="${seguro.compania}">Compania</p>
          <p class="text-white-50 small" th:text="${seguro.descripcion}">Descripcion</p>
          <div class="mt-3 p-3 bg-info bg-opacity-10 border rounded">
            <span class="text-info small">Cobertura:</span>
            <span class="text-info fw-bold h5 d-block" th:text="${seguro.coberturaGastos + ' €'}">0.00 €</span>
          </div>
        </div>
        <div class="card-footer bg-dark border-secondary">
          <a th:href="@{/seguros/nuevo}" class="btn btn-outline-info w-100">Contratar</a>
        </div>
      </div>
    </div>
  </div>

  <div class="text-center py-5" th:if="${#lists.isEmpty(seguros)}">
    <p class="text-white-50">No hay seguros disponibles en estos momentos.</p>
  </div>

  <div class="text-center mt-5">
    <a th:href="@{/servicios/alquiler}" class="btn btn-outline-light">Volver a Alquileres y Seguros</a>
  </div>
</main>

<div id="siteFooter" th:insert="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
