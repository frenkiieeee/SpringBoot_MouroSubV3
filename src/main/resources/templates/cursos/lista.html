<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Cursos</title>
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="fw-bold">Cursos</h1>
      <p class="text-muted mb-0">Gestión de cursos registrados en el sistema.</p>
    </div>
    <a class="btn btn-primary" th:href="@{/cursos/nuevo}">Nuevo curso</a>
  </div>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Tipo</th>
          <th>Nivel requerido</th>
          <th>Duración (h)</th>
          <th>Precio</th>
          <th>Fecha</th>
          <th>Activo</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="curso : ${cursos}">
          <td th:text="${curso.nombre}">Nombre del curso</td>
          <td th:text="${curso.tipo}">Tipo</td>
          <td th:text="${curso.nivelRequerido}">Nivel</td>
          <td th:text="${curso.duracionHoras}">0</td>
          <td th:text="${curso.precio} + ' €'">0.00 €</td>
          <td th:text="${curso.fechaActividad}">2026-05-21</td>
          <td th:text="${curso.activo} ? 'Sí' : 'No'">Sí</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/cursos/editar/{id}(id=${curso.idActividad})}">Editar</a>
            <a class="btn btn-sm btn-outline-danger" th:href="@{/cursos/eliminar/{id}(id=${curso.idActividad})}">Eliminar</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(cursos)}">
          <td colspan="8" class="text-center text-muted">No hay cursos registrados aún.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <a class="btn btn-link" th:href="@{/}">Volver al inicio</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
