<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Registrarse | Mourosub</title>
</head>
<body>
<main class="container" style="padding-top: 40px;">

  <!-- El titulo cambia segun venga el objeto con id o sin el.
       Si getidUsuario() devuelve null, es un usuario nuevo; si tiene valor, es una edicion.
       Mismo patron que en admin/servicios/tecnico/formulario.html con idServicioTecnico. -->
  <h1 class="fw-bold"
      th:text="${usuario.getidUsuario() == null ? 'Nuevo usuario' : 'Editar usuario'}">
    Usuario
  </h1>

  <!-- th:action apunta siempre a /usuarios/guardar: el controlador distingue
       crear de editar por si el id viene relleno o nulo en el objeto.
       th:object="${usuario}" enlaza el formulario con el objeto del modelo;
       a partir de aqui, th:field="*{campo}" es equivalente a th:field="${usuario.campo}". -->
  <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="row g-3">

    <!-- Campo oculto con el id: si viene relleno el servidor hace UPDATE;
         si es null hace INSERT. Spring/JPA lo gestiona automaticamente. -->
    <input type="hidden" th:field="*{idUsuario}">

    <!-- ── Datos personales ─────────────────────────────────────── -->
    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <!-- th:field="*{nombre}" hace tres cosas a la vez:
           - pone name="nombre" (para que el POST lleve el campo al controlador)
           - pone id="nombre" (para el label)
           - rellena value con el valor actual del campo si es una edicion -->
      <input type="text" class="form-control" th:field="*{nombre}">
    </div>

    <div class="col-md-6">
      <label class="form-label">Apellidos</label>
      <input type="text" class="form-control" th:field="*{apellidos}">
    </div>

     <!-- Campo Email Principal -->
    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" th:field="*{email}" id="email" required>
      <div class="invalid-feedback">Por favor, introduce un email válido.</div>
    </div>

    <!-- Repetir Email -->
    <div class="col-md-6">
      <label class="form-label">Repetir Email</label>
      <input type="email" class="form-control" id="repetirEmail" name="repetirEmail" required>
      <div class="invalid-feedback" id="errorRepetirEmail">El email no coincide.</div>
    </div>


    <div class="col-md-6">
      <label class="form-label">DNI</label>
      <input type="text" class="form-control" th:field="*{dni}">
    </div>

    <div class="col-md-6">
      <label class="form-label">Telefono</label>
      <input type="text" class="form-control" th:field="*{telefono}">
    </div>

    <div class="col-md-6">
      <label class="form-label">Fecha de nacimiento</label>
      <!-- type="date": el navegador muestra un selector de fecha.
           Thymeleaf convierte el LocalDate a yyyy-MM-dd automaticamente con th:field. -->
      <input type="date" class="form-control" th:field="*{fechaNacimiento}">
    </div>

    <!-- ── Direccion ─────────────────────────────────────────────── -->
    <div class="col-md-8">
      <label class="form-label">Localidad</label>
      <input type="text" class="form-control" th:field="*{localidad}">
    </div>

    <!-- ── Botones de accion ──────────────────────────────────────── -->
    <div class="col-12">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn btn-link" th:href="@{/usuarios}">Cancelar</a>
    </div>

  </form>
</main>
</body>
</html>
