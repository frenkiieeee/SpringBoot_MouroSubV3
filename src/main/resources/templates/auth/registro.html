<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- comentario: formulario ajustado para enviar JSON a /auth/sync y evitar Unsupported Media Type -->
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Datos personales | Mourosub</title>
</head>
<body class="plain-page">

<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px; max-width: 760px;">
  <h1 class="fw-bold mb-3"
      th:text="${usuario.getidUsuario() == null ? 'Datos personales' : 'Editar datos personales'}">
    Datos personales
  </h1>
  <p class="text-muted">Mantén actualizada tu información de usuario.</p>

  <!-- th:object enlaza el form con el objeto 'usuario' para que th:field genere name e id correctos. -->
  <form id="registroForm" class="row g-3" th:object="${usuario}">

    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" name="nombre" th:value="*{nombre}" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Apellidos</label>
      <input type="text" class="form-control" id="apellidos" name="apellidos" th:value="*{apellidos}" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" th:value="*{email}" readonly required>
    </div>

    <div class="col-md-6">
      <label class="form-label">DNI</label>
      <input type="text" class="form-control" id="dni" name="dni" th:value="*{dni}" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Teléfono</label>
      <input type="text" class="form-control" id="telefono" name="telefono" th:value="*{telefono}" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Fecha de nacimiento</label>
      <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" th:value="*{fechaNacimiento}" required>
    </div>

    <div class="col-md-8">
      <label class="form-label">Dirección</label>
      <input type="text" class="form-control" id="direccion" name="direccion" th:value="*{direccion}" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Código postal</label>
      <input type="text" class="form-control" id="codPostal" name="codPostal" th:value="*{codPostal}" required>
    </div>

    <div class="col-12">
      <label class="form-label">Localidad</label>
      <input type="text" class="form-control" id="localidad" name="localidad" th:value="*{localidad}" required>
    </div>

    <div class="col-12 d-flex gap-2">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn btn-link" th:href="@{/cuenta}">Cancelar</a>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>

if (window.initHeaderSession) window.initHeaderSession();

  // Cargamos los datos personales actuales desde /auth/profile cuando el usuario ya tiene sesion.
  // Sirve tanto para registro nuevo (autocompletar email) como para edicion (precargar todo).
  const storedUserId = localStorage.getItem('supabaseUserId');
  const storedEmail = localStorage.getItem('supabaseUserEmail') || '';
  const emailInput = document.getElementById('email');
  if (emailInput && !emailInput.value) emailInput.value = storedEmail;

  // Si hay sesion intentamos rellenar el resto de campos con lo que ya hay en la base de datos.
  if (storedUserId) {
    fetch('/auth/profile?supabaseUserId=' + encodeURIComponent(storedUserId))
      .then(r => r.ok ? r.json() : null)
      .then(profile => {
        if (!profile) return;
        const setVal = (id, val) => {
          const el = document.getElementById(id);
          if (el && !el.value && val) el.value = val;
        };
        setVal('nombre', profile.nombre);
        setVal('apellidos', profile.apellidos);
        setVal('email', profile.email);
        setVal('dni', profile.dni);
        setVal('telefono', profile.telefono);
        setVal('fechaNacimiento', profile.fechaNacimiento);
        setVal('direccion', profile.direccion);
        setVal('codPostal', profile.codPostal);
        setVal('localidad', profile.localidad);
      });
  }

  // Intercepta el formulario para mandarlo al AuthController
  document.getElementById('registroForm').addEventListener('submit', async function(e) {
    e.preventDefault(); 

    const supabaseUserId = storedUserId;
    if (!supabaseUserId) {
        alert("Error: No estás autenticado.");
        return;
    }

    const formData = new FormData(this);
    const payload = Object.fromEntries(formData.entries());
    payload.supabaseUserId = supabaseUserId;

    try {
      const response = await fetch('/auth/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

        if (response.ok) {
            window.location.href = '/cuenta'; 
        } else {
            const err = await response.json().catch(() => ({}));
            alert("Error al guardar: " + (err.error || "Desconocido"));
        }
    } catch (error) {
        console.error("Error:", error);
        alert("Error de red al intentar guardar.");
    }
  });
  
</script>

</body>
</html>
