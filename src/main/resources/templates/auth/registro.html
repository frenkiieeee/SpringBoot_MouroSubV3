<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Datos personales | Mourosub</title>
</head>
<body>

<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px; max-width: 760px;">
  <h1 class="fw-bold mb-3"
      th:text="${usuario.getidUsuario() == null ? 'Datos personales' : 'Editar datos personales'}">
    Datos personales
  </h1>
  <p class="text-muted">Mantén actualizada tu información de usuario.</p>

  <form id="registroForm" class="row g-3">

    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Apellidos</label>
      <input type="text" class="form-control" th:field="*{apellidos}" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" th:field="*{email}" readonly required>
    </div>

    <div class="col-md-6">
      <label class="form-label">DNI</label>
      <input type="text" class="form-control" th:field="*{dni}" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Teléfono</label>
      <input type="text" class="form-control" th:field="*{telefono}" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Fecha de nacimiento</label>
      <input type="date" class="form-control" th:field="*{fechaNacimiento}" required>
    </div>

    <div class="col-md-8">
      <label class="form-label">Dirección</label>
      <input type="text" class="form-control" th:field="*{direccion}" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Código postal</label>
      <input type="text" class="form-control" th:field="*{codPostal}" required>
    </div>

    <div class="col-12">
      <label class="form-label">Localidad</label>
      <input type="text" class="form-control" th:field="*{localidad}" required>
    </div>

    <div class="col-12 d-flex gap-2">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn btn-link" th:href="@{/cuenta}">Cancelar</a>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>

if (window.initHeaderSession) window.initHeaderSession();

  // Autocompleta el email desde Supabase si es un registro nuevo y está vacío
  const emailInput = document.getElementById('emailInput');
  if (!emailInput.value) {
      emailInput.value = localStorage.getItem('supabaseUserEmail') || '';
  }

  // Intercepta el formulario para mandarlo al AuthController
  document.getElementById('registroForm').addEventListener('submit', async function(e) {
    e.preventDefault(); 

    const supabaseUserId = localStorage.getItem('supabaseUserId');
    if (!supabaseUserId) {
        alert("Error: No estás autenticado.");
        return;
    }

    const formData = new FormData(this);
    formData.append("supabaseUserId", supabaseUserId);

    try {
        const response = await fetch('/auth/sync', {
            method: 'POST',
            body: new URLSearchParams(formData)
        });

        if (response.ok) {
            window.location.href = '/cuenta'; 
        } else {
            const err = await response.json();
            alert("Error al guardar: " + (err.error || "Desconocido"));
        }
    } catch (error) {
        console.error("Error:", error);
        alert("Error de red al intentar guardar.");
    }
  });
  
</script>

</body>
</html>
