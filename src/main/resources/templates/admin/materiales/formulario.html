<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Materiales - Formulario</title>
</head>
<body>
<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <h1 class="fw-bold mb-4" th:text="${material.idMaterial != null} ? 'Editar Material' : 'Nuevo Material'">Formulario</h1>

  <form th:action="@{/admin/materiales/guardar}" th:object="${material}" method="post" class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Categoria</label>
      <input type="text" class="form-control" th:field="*{categoria}" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Modelo</label>
      <input type="text" class="form-control" th:field="*{modelo}" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Marca</label>
      <input type="text" class="form-control" th:field="*{marca}" required>
    </div>
    <div class="col-12">
      <label class="form-label">Numero de Serie</label>
      <input type="text" class="form-control" th:field="*{numSerie}" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Estado de Conservacion</label>
      <input type="text" class="form-control" th:field="*{estadoConservacion}" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Precio Base</label>
      <input type="number" step="0.01" class="form-control" th:field="*{precioBase}" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Precio por Dia</label>
      <input type="number" step="0.01" class="form-control" th:field="*{precioPorDia}" required>
    </div>
    <input type="hidden" th:field="*{idMaterial}">
    <div class="col-12">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a class="btn btn-link" th:href="@{/admin/materiales}">Cancelar</a>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
