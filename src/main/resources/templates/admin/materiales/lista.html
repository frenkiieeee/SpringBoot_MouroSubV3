<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Materiales</title>
</head>
<body class="plain-page">
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold">Materiales</h1>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" th:href="@{/admin/materiales/nuevo}">Nuevo material</a>
      <a class="btn btn-link" th:href="@{/admin}">Volver al admin</a>
    </div>
  </div>

  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Categoria</th>
        <th>Modelo</th>
        <th>Marca</th>
        <th>Estado</th>
        <th>Precio/Dia</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="material : ${materiales}">
        <td th:text="${material.idMaterial}">1</td>
        <td th:text="${material.nombre}">Nombre</td>
        <td th:text="${material.categoria}">Categoria</td>
        <td th:text="${material.modelo}">Modelo</td>
        <td th:text="${material.marca}">Marca</td>
        <td th:text="${material.estadoConservacion}">Estado</td>
        <td th:text="${material.precioPorDia}">0.00</td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/materiales/editar/{id}(id=${material.idMaterial})}">Editar</a>
          <a class="btn btn-sm btn-outline-danger" th:href="@{/admin/materiales/eliminar/{id}(id=${material.idMaterial})}">Eliminar</a>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(materiales)}">
        <td colspan="8" class="text-center">No hay materiales registrados.</td>
      </tr>
    </tbody>
  </table>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
