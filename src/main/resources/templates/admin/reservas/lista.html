<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Reservas</title>
</head>
<body class="plain-page">
<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="fw-bold">Reservas</h1>
    <a class="btn btn-link" th:href="@{/admin}">Volver al admin</a>
  </div>

  <!-- Tabla con todas las reservas que el controlador puso en el modelo -->
  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Tipo</th>
        <th>Servicio</th>
        <th>Participantes</th>
        <th>Precio total</th>
        <th>Estado</th>
        <th>Fecha reserva</th>
        <th>Fecha actividad</th>
        <th>Usuarios</th>
      </tr>
    </thead>
    <tbody>
      <!-- th:each recorre la lista ${reservas}; crea una fila <tr> por cada reserva -->
      <tr th:each="reserva : ${reservas}">
        <!-- th:text pone dentro de la celda el valor del campo. El "1", "Tipo"... son
             solo texto de ejemplo que se ve al abrir el HTML suelto; Thymeleaf lo sustituye. -->
        <td th:text="${reserva.idReserva}">1</td>
        <td th:text="${reserva.tipoServicio}">Tipo</td>
        <td th:text="${reserva.refServicio}">Servicio</td>
        <td th:text="${reserva.numParticipantes}">0</td>
        <td th:text="${reserva.precioTotal}">0.00</td>
        <td th:text="${reserva.estado}">Estado</td>
        <td th:text="${reserva.fechaReserva}">2026-01-01</td>
        <td th:text="${reserva.fechaActividad}">2026-01-01</td>
        <td>
          <!-- Recorremos los usuarios de la reserva. 'it' es el estado de la iteracion:
               it.last es true en el ultimo, asi separamos los nombres con comas. -->
          <span th:each="u, it : ${reserva.usuarios}"
                th:text="${u.nombre} + (${it.last} ? '' : ', ')">Nombre</span>
        </td>
      </tr>
      <!-- th:if: esta fila solo aparece si la lista de reservas esta vacia -->
      <tr th:if="${#lists.isEmpty(reservas)}">
        <td colspan="9" class="text-muted">No hay reservas registradas.</td>
      </tr>
    </tbody>
  </table>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
