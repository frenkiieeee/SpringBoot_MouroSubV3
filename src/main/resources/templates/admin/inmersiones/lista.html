<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Inmersiones</title>
</head>
<body>
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold">Inmersiones</h1>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" th:href="@{/admin/inmersiones/nueva}">
        <i class="bi bi-plus-circle"></i> Nueva inmersión
      </a>
      <a class="btn btn-link" th:href="@{/admin}">Volver al admin</a>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Ubicación</th>
          <th>Nivel</th>
          <th>Dificultad</th>
          <th>Profundidad</th>
          <th>Precio</th>
          <th>Plazas</th>
          <th>Activo</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="inmersion : ${inmersiones}">
          <td th:text="${inmersion.idActividad}">1</td>
          <td th:text="${inmersion.nombre}">Nombre</td>
          <td th:text="${inmersion.ubicacion != null ? inmersion.ubicacion : '-'}">Ubicación</td>
          <td th:text="${inmersion.nivelReq}">Nivel</td>
          <td th:text="${inmersion.dificultad != null ? inmersion.dificultad : '-'}">Dificultad</td>
          <td th:text="${inmersion.profundidadMax != null ? inmersion.profundidadMax + 'm' : '-'}">Profundidad</td>
          <td th:text="${'€' + #numbers.formatDecimal(inmersion.precio, 1, 2)}">0.00</td>
          <td>
            <span th:text="${inmersion.plazasOcupadas}">0</span> /
            <span th:text="${inmersion.plazasMax}">10</span>
          </td>
          <td>
            <span th:text="${inmersion.activo ? 'Sí' : 'No'}" th:class="${inmersion.activo ? 'text-success' : 'text-danger'}">Sí</span>
          </td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/inmersiones/editar/{id}(id=${inmersion.idActividad})}">Editar</a>
            <a class="btn btn-sm btn-outline-danger" th:href="@{/admin/inmersiones/eliminar/{id}(id=${inmersion.idActividad})}"
               onclick="return confirm('¿Eliminar esta inmersión?');">Eliminar</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(inmersiones)}">
          <td colspan="10" class="text-muted text-center">No hay inmersiones registradas.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
