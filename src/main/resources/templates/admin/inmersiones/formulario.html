<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Inmersiones - Formulario</title>
</head>
<body>
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <h1 class="fw-bold mb-4" th:text="${inmersion.idInmersion != null} ? 'Editar Inmersión' : 'Nueva Inmersión'">Formulario</h1>

  <form th:action="@{/admin/inmersiones/guardar}" th:object="${inmersion}" method="post" class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Ubicación</label>
      <input type="text" class="form-control" th:field="*{ubicacion}" placeholder="Ej: Cantabria">
    </div>
    <div class="col-12">
      <label class="form-label">Descripción</label>
      <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
    </div>
    <div class="col-md-4">
      <label class="form-label">Nivel requerido</label>
      <input type="text" class="form-control" th:field="*{nivelReq}" placeholder="Ej: Open Water">
    </div>
    <div class="col-md-4">
      <label class="form-label">Dificultad</label>
      <select class="form-select" th:field="*{dificultad}">
        <option value="">Seleccionar...</option>
        <option value="Todos los niveles">Todos los niveles</option>
        <option value="Iniciación">Iniciación</option>
        <option value="Medio">Medio</option>
        <option value="Avanzado">Avanzado</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Profundidad máxima (m)</label>
      <input type="number" class="form-control" th:field="*{profundidadMax}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Visibilidad (m)</label>
      <input type="number" class="form-control" th:field="*{visibilidad}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Corriente</label>
      <select class="form-select" th:field="*{corriente}">
        <option value="">Seleccionar...</option>
        <option value="Ninguna">Ninguna</option>
        <option value="Leve">Leve</option>
        <option value="Moderada">Moderada</option>
        <option value="Fuerte">Fuerte</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Temperatura del agua</label>
      <input type="text" class="form-control" th:field="*{temperaturaAgua}" placeholder="Ej: 18°C">
    </div>
    <div class="col-md-4">
      <label class="form-label">Equipamiento incluido</label>
      <input type="text" class="form-control" th:field="*{equipamientoIncluido}" placeholder="Ej: Botella, regulador">
    </div>
    <div class="col-md-4">
      <label class="form-label">Requisitos</label>
      <input type="text" class="form-control" th:field="*{requisitos}" placeholder="Ej: Certificación Open Water">
    </div>
    <div class="col-md-4">
      <label class="form-label">URL Imagen</label>
      <input type="text" class="form-control" th:field="*{imagenUrl}" placeholder="https://...">
    </div>
    <div class="col-md-4">
      <label class="form-label">Duración (minutos)</label>
      <input type="number" class="form-control" th:field="*{duracionMinutos}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Plazas máximas</label>
      <input type="number" class="form-control" th:field="*{plazasMax}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Precio (€)</label>
      <input type="number" step="0.01" class="form-control" th:field="*{precio}" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Fecha de actividad</label>
      <input type="date" class="form-control" th:field="*{fechaActividad}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Activo</label>
      <select class="form-select" th:field="*{activo}">
        <option value="true">Sí</option>
        <option value="false">No</option>
      </select>
    </div>
    <input type="hidden" th:field="*{idInmersion}">
    <input type="hidden" th:field="*{tipo}" value="INMERSION">
    <input type="hidden" th:field="*{plazasOcupadas}">
    <div class="col-12">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a class="btn btn-link" th:href="@{/admin/inmersiones}">Cancelar</a>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
