<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Seguros</title>
</head>
<body>
<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold">Seguros</h1>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" th:href="@{/admin/seguros/nuevo}">Nuevo seguro</a>
      <a class="btn btn-link" th:href="@{/admin}">Volver al admin</a>
    </div>
  </div>

  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Compania</th>
        <th>Cobertura</th>
        <th>Activo</th>
        <th>Descripcion</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="seguro : ${seguros}">
        <td th:text="${seguro.idSeguro}">1</td>
        <td th:text="${seguro.nombre}">Nombre</td>
        <td th:text="${seguro.compania}">Compania</td>
        <td th:text="${seguro.coberturaGastos}">0.00</td>
        <td th:text="${seguro.activo} ? 'Si' : 'No'">No</td>
        <td th:text="${seguro.descripcion}">Descripcion</td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/seguros/editar/{id}(id=${seguro.idSeguro})}">Editar</a>
          <a class="btn btn-sm btn-outline-danger" th:href="@{/admin/seguros/eliminar/{id}(id=${seguro.idSeguro})}">Eliminar</a>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(seguros)}">
        <td colspan="7" class="text-center">No hay seguros registrados.</td>
      </tr>
    </tbody>
  </table>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
