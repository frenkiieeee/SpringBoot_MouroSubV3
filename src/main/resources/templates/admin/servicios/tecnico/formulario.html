<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Servicio tecnico</title>
</head>
<body>
<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <!-- El titulo cambia segun haya id o no: sin id es nuevo, con id es edicion -->
  <h1 class="fw-bold" th:text="${servicio.idServicioTecnico == null ? 'Nuevo servicio' : 'Editar servicio'}">Servicio</h1>

  <!-- th:object="${servicio}" enlaza el formulario con ese objeto.
       Dentro, th:field="*{campo}" conecta cada input con un campo del objeto:
       al cargar lo rellena y al enviar recoge lo escrito. -->
  <form th:action="@{/admin/servicios/tecnico/guardar}" th:object="${servicio}" method="post" class="row g-3">
    <!-- Campo oculto con el id: si viene relleno, el servidor sabe que es una edicion -->
    <input type="hidden" th:field="*{idServicioTecnico}">
    <div class="col-md-6">
      <label class="form-label">Titulo</label>
      <!-- required: el navegador no deja enviar el formulario si esta vacio -->
      <input type="text" class="form-control" th:field="*{titulo}" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Categoria</label>
      <input type="text" class="form-control" th:field="*{categoria}">
    </div>
    <div class="col-12">
      <label class="form-label">Descripcion</label>
      <textarea class="form-control" th:field="*{descripcion}" rows="4"></textarea>
    </div>
    <div class="col-md-4">
      <label class="form-label">Orden</label>
      <input type="number" class="form-control" th:field="*{orden}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Activo</label>
      <!-- Desplegable enlazado al campo 'activo'; Thymeleaf marca la opcion correcta -->
      <select class="form-select" th:field="*{activo}">
        <option th:value="true">true</option>
        <option th:value="false">false</option>
      </select>
    </div>
    <div class="col-12">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn btn-link" th:href="@{/admin/servicios/tecnico}">Cancelar</a>
    </div>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
