<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Servicios tecnicos</title>
</head>
<body>
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="fw-bold">Servicios tecnicos</h1>
    <!-- Boton para ir al formulario de creacion de un servicio nuevo -->
    <a class="btn btn-primary" th:href="@{/admin/servicios/tecnico/nuevo}">Nuevo</a>
  </div>

  <!-- Tabla con todos los servicios tecnicos -->
  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>Titulo</th>
        <th>Categoria</th>
        <th>Activo</th>
        <th>Orden</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <!-- Una fila por cada servicio de la lista ${servicios} -->
      <tr th:each="servicio : ${servicios}">
        <td th:text="${servicio.titulo}">Titulo</td>
        <td th:text="${servicio.categoria}">Categoria</td>
        <td th:text="${servicio.activo}">true</td>
        <td th:text="${servicio.orden}">0</td>
        <td class="text-end">
          <!-- @{...(id=${...})} construye la URL metiendo el id del servicio en {id} -->
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/servicios/tecnico/editar/{id}(id=${servicio.idServicioTecnico})}">Editar</a>
          <!-- Eliminar va en un formulario porque es una accion POST (modifica datos) -->
          <form th:action="@{/admin/servicios/tecnico/eliminar/{id}(id=${servicio.idServicioTecnico})}" method="post" class="d-inline">
            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <a class="btn btn-link" th:href="@{/admin}">Volver al admin</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
