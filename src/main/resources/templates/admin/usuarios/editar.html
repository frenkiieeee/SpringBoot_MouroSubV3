<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Editar usuario</title>
</head>
<body>
<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px; max-width: 760px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="fw-bold">Editar usuario</h1>
    <a class="btn btn-link" th:href="@{/admin/usuarios}">Volver a usuarios</a>
  </div>

  <!-- Form que manda los cambios al endpoint /admin/usuarios/{id}/editar. -->
  <form th:action="@{/admin/usuarios/{id}/editar(id=${usuario.getidUsuario()})}"
        th:object="${usuario}" method="post" class="row g-3">

    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Apellidos</label>
      <input type="text" class="form-control" th:field="*{apellidos}">
    </div>

    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" th:field="*{email}">
    </div>

    <div class="col-md-6">
      <label class="form-label">DNI</label>
      <input type="text" class="form-control" th:field="*{dni}">
    </div>

    <div class="col-md-6">
      <label class="form-label">Telefono</label>
      <input type="text" class="form-control" th:field="*{telefono}">
    </div>

    <div class="col-md-6">
      <label class="form-label">Fecha de nacimiento</label>
      <input type="date" class="form-control" th:field="*{fechaNacimiento}">
    </div>

    <div class="col-md-8">
      <label class="form-label">Direccion</label>
      <input type="text" class="form-control" th:field="*{direccion}">
    </div>

    <div class="col-md-4">
      <label class="form-label">Codigo postal</label>
      <input type="text" class="form-control" th:field="*{codPostal}">
    </div>

    <div class="col-12">
      <label class="form-label">Localidad</label>
      <input type="text" class="form-control" th:field="*{localidad}">
    </div>

    <div class="col-12 d-flex gap-2">
      <button class="btn btn-primary" type="submit">Guardar cambios</button>
      <a class="btn btn-link" th:href="@{/admin/usuarios}">Cancelar</a>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
