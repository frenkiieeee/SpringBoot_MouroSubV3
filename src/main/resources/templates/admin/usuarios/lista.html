<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Gestor de usuarios</title>
</head>
<body class="plain-page">
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="fw-bold">Gestor de usuarios</h1>
    <a class="btn btn-link" th:href="@{/admin}">Volver al admin</a>
  </div>

  <!-- Tabla con todos los usuarios registrados -->
  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellidos</th>
        <th>Email</th>
        <th>DNI</th>
        <th>Telefono</th>
        <th>Localidad</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <!-- Una fila por cada usuario de la lista ${usuarios} -->
      <tr th:each="usuario : ${usuarios}">
        <!-- Llamamos al metodo getidUsuario() directamente porque su nombre no es estandar
             y Thymeleaf no lo encuentra como propiedad 'idUsuario'. -->
        <td th:text="${usuario.getidUsuario()}">1</td>
        <td th:text="${usuario.nombre}">Nombre</td>
        <td th:text="${usuario.apellidos}">Apellidos</td>
        <td th:text="${usuario.email}">Email</td>
        <td th:text="${usuario.dni}">DNI</td>
        <td th:text="${usuario.telefono}">Telefono</td>
        <td th:text="${usuario.localidad}">Localidad</td>
        <td>
          <!-- th:if muestra el badge si es admin; th:unless lo muestra si NO lo es -->
          <span th:if="${usuario.admin}" class="badge text-bg-success">Admin</span>
          <span th:unless="${usuario.admin}" class="badge text-bg-secondary">Usuario</span>
        </td>
        <td>
          <!-- Estado de baneo: badge rojo si esta baneado, gris claro si esta activo. -->
          <span th:if="${usuario.banned}" class="badge text-bg-danger">Baneado</span>
          <span th:unless="${usuario.banned}" class="badge text-bg-light">Activo</span>
        </td>
        <td class="text-nowrap">
          <!-- Ver detalle: ficha con certificados del usuario. -->
          <a class="btn btn-sm btn-outline-primary"
             th:href="@{/admin/usuarios/{id}(id=${usuario.getidUsuario()})}">Ver</a>

          <!-- Editar: formulario admin para modificar los datos del usuario. -->
          <a class="btn btn-sm btn-outline-secondary"
             th:href="@{/admin/usuarios/{id}/editar(id=${usuario.getidUsuario()})}">Editar</a>

          <!-- Banear / desbanear: mismo endpoint que conmuta el flag. -->
          <form th:action="@{/admin/usuarios/{id}/ban(id=${usuario.getidUsuario()})}" method="post" class="d-inline">
            <button type="submit"
                    th:class="${usuario.banned} ? 'btn btn-sm btn-outline-success' : 'btn btn-sm btn-outline-warning'"
                    th:text="${usuario.banned} ? 'Desbanear' : 'Banear'">Banear</button>
          </form>

          <!-- Eliminar: POST con confirm para evitar borrados accidentales. -->
          <form th:action="@{/admin/usuarios/{id}/eliminar(id=${usuario.getidUsuario()})}" method="post" class="d-inline"
                onsubmit="return confirm('Eliminar este usuario? Esta accion no se puede deshacer.');">
            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
          </form>
        </td>
      </tr>
      <!-- Fila que aparece solo si no hay ningun usuario -->
      <tr th:if="${#lists.isEmpty(usuarios)}">
        <td colspan="10" class="text-muted">No hay usuarios registrados.</td>
      </tr>
    </tbody>
  </table>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
