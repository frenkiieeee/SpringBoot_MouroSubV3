<!doctype html>
<html lang="es" class="plain-page" xmlns:th="http://www.thymeleaf.org">
<!-- comentario: formulario admin instructores limpio de footer y con fondo plain page -->
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Instructores - Formulario</title>
</head>
<body class="plain-page">
<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold" th:text="${instructor.getidInstructor() != null} ? 'Editar Instructor' : 'Nuevo Instructor'">Formulario</h1>
    <a class="btn btn-link" th:href="@{/admin/instructores}">Volver</a>
  </div>

  <form th:action="@{/admin/instructores/guardar}" th:object="${instructor}" method="post" class="row g-3">
    <input type="hidden" th:field="*{idInstructor}">

    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" th:field="*{nombre}" required maxlength="150">
    </div>

    <div class="col-md-6">
      <label class="form-label">DNI</label>
      <input type="text" class="form-control" th:field="*{dni}" maxlength="20">
    </div>

    <div class="col-12">
      <label class="form-label">Certificaciones</label>
      <textarea class="form-control" th:field="*{certificaciones}" rows="4"></textarea>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a class="btn btn-secondary" th:href="@{/admin/instructores}">Cancelar</a>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
