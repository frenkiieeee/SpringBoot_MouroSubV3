<!doctype html>
<html lang="es" class="plain-page" xmlns:th="http://www.thymeleaf.org">
<!-- comentario: formulario admin de actividades modificado por mi para manejo de imagenes y campos -->
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Actividades - Formulario</title>
</head>
<body class="plain-page">
<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <h1 class="fw-bold mb-4" th:text="${actividad.idActividad != null} ? 'Editar Actividad' : 'Nueva Actividad'">Formulario</h1>

  <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>
  <form th:action="@{/admin/actividades/guardar}" th:object="${actividad}" method="post" enctype="multipart/form-data" class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Tipo</label>
      <select class="form-select" th:field="*{tipo}" required>
        <option value="">Seleccionar...</option>
        <option value="CURSO">Curso</option>
        <option value="INMERSION">Inmersion</option>
        <option value="SNORKEL">Snorkel</option>
        <option value="PASEO_BARCO">Paseo en barco</option>
      </select>
    </div>
    <div class="col-12">
      <label class="form-label">Descripcion</label>
      <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
    </div>
    <div class="col-md-4">
      <label class="form-label">Duracion (minutos)</label>
      <input type="number" class="form-control" th:field="*{duracionMinutos}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Plazas maximas</label>
      <input type="number" class="form-control" th:field="*{plazasMax}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Precio</label>
      <input type="number" step="0.01" class="form-control" th:field="*{precio}" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Fecha de actividad</label>
      <input type="date" class="form-control" th:field="*{fechaActividad}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Requiere nivel</label>
      <select class="form-select" th:field="*{requiereNivel}">
        <option value="false">No</option>
        <option value="true">Si</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Activo</label>
      <select class="form-select" th:field="*{activo}">
        <option value="true">Si</option>
        <option value="false">No</option>
      </select>
    </div>
    <div class="col-12">
      <label class="form-label">Imagen actual (URL)</label>
      <input type="text" class="form-control" th:field="*{imagenUrl}" placeholder="/ficheros/ver/123 o https://...">
      <div class="form-text">Puedes mantener esta URL o sobrescribirla con imagen existente / nueva.</div>
    </div>
    <div class="col-md-6">
      <label class="form-label">Seleccionar imagen ya subida</label>
      <select class="form-select" name="imagenExistenteId">
        <option value="">-- No cambiar --</option>
        <option th:each="img : ${imagenes}" th:value="${img.idFichero}" th:text="${img.nombre + ' (' + img.idFichero + ')'}"></option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Subir nueva imagen</label>
      <input type="file" class="form-control" name="imagenArchivo" accept="image/*">
    </div>
    <input type="hidden" th:field="*{idActividad}">
    <input type="hidden" th:field="*{plazasOcupadas}">
    <div class="col-12">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a class="btn btn-link" th:href="@{/admin}">Cancelar</a>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
