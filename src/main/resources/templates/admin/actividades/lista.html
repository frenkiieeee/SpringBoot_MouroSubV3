<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Actividades</title>
</head>
<body>
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold">Actividades</h1>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" th:href="@{/admin/actividades/nueva}">Nueva actividad</a>
      <a class="btn btn-link" th:href="@{/admin}">Volver al admin</a>
    </div>
  </div>

  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Tipo</th>
        <th>Precio</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="actividad : ${actividades}">
        <td th:text="${actividad.idActividad}">1</td>
        <td th:text="${actividad.nombre}">Nombre</td>
        <td th:text="${actividad.tipo}">Tipo</td>
        <td th:text="${actividad.precio}">0.00</td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/actividades/editar/{id}(id=${actividad.idActividad})}">Editar</a>
          <a class="btn btn-sm btn-outline-danger" th:href="@{/admin/actividades/eliminar/{id}(id=${actividad.idActividad})}">Eliminar</a>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(actividades)}">
        <td colspan="5" class="text-center">No hay actividades registradas.</td>
      </tr>
    </tbody>
  </table>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
