<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Instructores</title>
</head>
<body>
<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="fw-bold">Instructores</h1>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" th:href="@{/instructores/nuevo}">Nuevo instructor</a>
      <a class="btn btn-link" th:href="@{/admin}">Volver al admin</a>
    </div>
  </div>

  <!-- El controlador mete la lista con:
       model.addAttribute("instructores", instructorRepository.findAll()) -->
  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>DNI</th>
        <th>Certificaciones</th>
        <th>Reservas asignadas</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="instructor : ${instructores}">
        <!-- getidInstructor() en vez de idInstructor: el getter tiene nombre no estandar,
             igual que getidUsuario() en la clase Usuario. -->
        <td th:text="${instructor.getidInstructor()}">1</td>
        <td th:text="${instructor.nombre}">Nombre</td>
        <td th:text="${instructor.dni}">DNI</td>
        <td th:text="${instructor.certificaciones}">Certificaciones</td>
        <!-- #lists.size() cuenta cuantas reservas tiene asignadas el instructor -->
        <td th:text="${#lists.size(instructor.reservas)}">0</td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-secondary"
             th:href="@{/instructores/editar/{id}(id=${instructor.getidInstructor()})}">Editar</a>

          <!-- El servicio lanza excepcion si se intenta eliminar un instructor con reservas.
               Con th:if / th:unless mostramos u ocultamos el boton segun el caso,
               para evitar llegar al error antes de intentarlo. -->
          <form th:action="@{/instructores/eliminar/{id}(id=${instructor.getidInstructor()})}"
                method="get" class="d-inline"
                th:if="${#lists.isEmpty(instructor.reservas)}">
            <button type="submit" class="btn btn-sm btn-outline-danger"
                    onclick="return confirm('Seguro que quieres eliminar este instructor?')">
              Eliminar
            </button>
          </form>
          <!-- Si tiene reservas, mostramos el boton desactivado con un tooltip explicativo -->
          <button class="btn btn-sm btn-outline-danger"
                  th:unless="${#lists.isEmpty(instructor.reservas)}"
                  disabled title="No se puede eliminar: tiene reservas asignadas">
            Eliminar
          </button>
        </td>
      </tr>

      <tr th:if="${#lists.isEmpty(instructores)}">
        <td colspan="6" class="text-muted">No hay instructores registrados.</td>
      </tr>
    </tbody>
  </table>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
