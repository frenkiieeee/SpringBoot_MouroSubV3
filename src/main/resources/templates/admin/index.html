<!doctype html>
<!-- xmlns:th habilita los atributos de Thymeleaf (th:*) -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin</title>
</head>
<body>
<main class="container" style="padding-top: 40px;">
  <!-- Cabecera del panel: titulo a la izquierda y enlace de salida a la derecha -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="fw-bold">Panel admin</h1>
    <!-- th:href="@{/}" -> enlace a la pagina de inicio del sitio -->
    <a class="btn btn-link" th:href="@{/}">Volver al sitio</a>
  </div>
  <p class="text-muted">Gestion de reservas, servicio tecnico y usuarios.</p>

  <!-- Rejilla con las 4 secciones del panel. Cada columna ocupa media fila en
       tablet (col-md-6) y un cuarto en escritorio (col-lg-3). -->
  <div class="row g-3">
    <div class="col-md-6 col-lg-3">
      <a class="btn btn-outline-primary w-100 py-3" th:href="@{/admin/reservas}">Reservas</a>
    </div>
    <div class="col-md-6 col-lg-3">
      <a class="btn btn-outline-primary w-100 py-3" th:href="@{/admin/tickets/servicio-tecnico}">Tickets servicio tecnico</a>
    </div>
    <div class="col-md-6 col-lg-3">
      <a class="btn btn-outline-primary w-100 py-3" th:href="@{/admin/servicios/tecnico}">Servicios tecnicos</a>
    </div>
    <div class="col-md-6 col-lg-3">
      <a class="btn btn-outline-primary w-100 py-3" th:href="@{/admin/usuarios}">Gestor de usuarios</a>
    </div>
  </div>
</main>
</body>
</html>
