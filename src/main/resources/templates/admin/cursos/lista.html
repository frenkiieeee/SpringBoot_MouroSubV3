<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Cursos</title>
</head>
<body>
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold">Cursos</h1>
    <a class="btn btn-primary" th:href="@{/admin/cursos/nuevo}">
      <i class="bi bi-plus-circle"></i> Nuevo curso
    </a>
  </div>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Nivel requerido</th>
          <th>Duración (h)</th>
          <th>Precio</th>
          <th>Plazas</th>
          <th>Activo</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="curso : ${cursos}">
          <td th:text="${curso.idCurso}">1</td>
          <td th:text="${curso.nombre}">Nombre del curso</td>
          <td th:text="${curso.categoria != null ? curso.categoria : '-'}">Categoría</td>
          <td th:text="${curso.nivelRequerido}">Ninguno</td>
          <td th:text="${curso.duracionHoras}">0</td>
          <td th:text="${curso.precio != null ? '€' + #numbers.formatDecimal(curso.precio, 1, 2) : '-'}">0.00</td>
          <td>
            <span th:text="${curso.plazasOcupadas}">0</span> /
            <span th:text="${curso.plazasMax}">10</span>
          </td>
          <td>
            <span th:text="${curso.activo ? 'Sí' : 'No'}" th:class="${curso.activo ? 'text-success' : 'text-danger'}">Sí</span>
          </td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/cursos/editar/{id}(id=${curso.idCurso})}">Editar</a>
            <a class="btn btn-sm btn-outline-danger" th:href="@{/admin/cursos/eliminar/{id}(id=${curso.idCurso})}"
               onclick="return confirm('¿Eliminar este curso?');">Eliminar</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(cursos)}">
          <td colspan="9" class="text-muted text-center">No hay cursos disponibles.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
