<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <title>Admin - Cursos - Formulario</title>
</head>
<body>
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container" style="padding-top: 120px;">
  <h1 class="fw-bold mb-4" th:text="${curso.idActividad != null} ? 'Editar Curso' : 'Nuevo Curso'">Formulario</h1>

  <form th:action="@{/admin/cursos/guardar}" th:object="${curso}" method="post" class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Categoría</label>
      <select class="form-select" th:field="*{categoria}">
        <option value="">Seleccionar...</option>
        <option value="Buceo">Buceo</option>
        <option value="Apnea">Apnea</option>
        <option value="Rescate">Rescate</option>
        <option value="Especialidad">Especialidad</option>
        <option value="Profesional">Profesional</option>
      </select>
    </div>
    <div class="col-12">
      <label class="form-label">Descripción</label>
      <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
    </div>
    <div class="col-md-4">
      <label class="form-label">Nivel requerido</label>
      <input type="text" class="form-control" th:field="*{nivelRequerido}" placeholder="Ej: Open Water">
    </div>
    <div class="col-md-4">
      <label class="form-label">Duración (horas)</label>
      <input type="number" class="form-control" th:field="*{duracionHoras}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Número de módulos</label>
      <input type="number" class="form-control" th:field="*{numModulos}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Temario</label>
      <textarea class="form-control" th:field="*{temario}" rows="2" placeholder="Temas incluidos en el curso"></textarea>
    </div>
    <div class="col-md-6">
      <label class="form-label">Incluye</label>
      <textarea class="form-control" th:field="*{incluye}" rows="2" placeholder="Qué incluye el curso (material, certificado, etc.)"></textarea>
    </div>
    <div class="col-md-4">
      <label class="form-label">Certificación incluida</label>
      <input type="text" class="form-control" th:field="*{certificacionIncluida}" placeholder="Ej: SSI Open Water">
    </div>
    <div class="col-md-4">
      <label class="form-label">URL Imagen</label>
      <input type="text" class="form-control" th:field="*{imagenUrl}" placeholder="https://...">
    </div>
    <div class="col-md-4">
      <label class="form-label">Teoría online</label>
      <select class="form-select" th:field="*{teoriaOnline}">
        <option value="false">No</option>
        <option value="true">Sí</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Duración sesión (minutos)</label>
      <input type="number" class="form-control" th:field="*{duracionMinutos}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Plazas máximas</label>
      <input type="number" class="form-control" th:field="*{plazasMax}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Precio (€)</label>
      <input type="number" step="0.01" class="form-control" th:field="*{precio}" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Fecha de actividad</label>
      <input type="date" class="form-control" th:field="*{fechaActividad}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Requiere nivel</label>
      <select class="form-select" th:field="*{requiereNivel}">
        <option value="false">No</option>
        <option value="true">Sí</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Activo</label>
      <select class="form-select" th:field="*{activo}">
        <option value="true">Sí</option>
        <option value="false">No</option>
      </select>
    </div>
    <input type="hidden" th:field="*{idActividad}">
    <input type="hidden" th:field="*{tipo}" value="CURSO">
    <input type="hidden" th:field="*{plazasOcupadas}">
    <div class="col-12">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a class="btn btn-link" th:href="@{/admin/cursos}">Cancelar</a>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
