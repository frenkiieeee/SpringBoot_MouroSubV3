<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Lista de actividades</title>
</head>
<body>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3">Actividades</h1>
    <a class="btn btn-primary" th:href="@{/actividades/nueva}">Nueva actividad</a>
  </div>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Tipo</th>
          <th>Fecha</th>
          <th>Precio</th>
          <th>Plazas</th>
          <th>Ocupadas</th>
          <th>Activo</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="actividad : ${actividades}">
          <td th:text="${actividad.idActividad}">1</td>
          <td th:text="${actividad.nombre}">Nombre</td>
          <td th:text="${actividad.tipo}">TIPO</td>
          <td th:text="${#temporals.format(actividad.fechaActividad, 'yyyy-MM-dd')}">2026-06-01</td>
          <td th:text="${actividad.precio}">0.00</td>
          <td th:text="${actividad.plazasMax}">10</td>
          <td th:text="${actividad.plazasOcupadas}">0</td>
          <td th:text="${actividad.activo} ? 'Sí' : 'No'">Sí</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary"
               th:href="@{/actividades/editar/{id}(id=${actividad.idActividad})}">
               Editar
            </a>
            <a class="btn btn-sm btn-outline-danger"
               th:href="@{/actividades/eliminar/{id}(id=${actividad.idActividad})}"
               onclick="return confirm('¿Eliminar esta actividad?');">
               Eliminar
            </a>
          </td>
        </tr>

        <tr th:if="${#lists.isEmpty(actividades)}">
          <td colspan="9" class="text-center text-muted">No hay actividades registradas.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
