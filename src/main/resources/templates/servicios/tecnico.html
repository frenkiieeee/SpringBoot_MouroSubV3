<!doctype html>
<html lang="es" class="h-100" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <link rel="stylesheet" th:href="@{/css/reservas.css}">
  <link rel="stylesheet" th:href="@{/css/forms.css}">
  <title>Servicio Técnico | Mourosub</title>
</head>
<body class="form-page">
<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main style="padding-top: 120px;">
<section class="form-section" style="text-align:center; padding-bottom: 0;">
  <p class="hero-label">SERVICIO TÉCNICO</p>
  <h2 class="form-title">Mantenimiento y reparación</h2>
  <p class="form-subtitle">Equipos de buceo revisados por técnicos certificados.</p>
</section>

<div class="cards-grid">
  <div class="card" th:each="servicio : ${servicios}">
    <img th:src="@{/img/Servicio_Tecnico/Imagen20.jpg}" alt="Servicio">
    <div class="card-overlay"></div>
    <div class="card-content">
      <span class="badge badge-cyan"><i class="bi bi-tools"></i> <span th:text="${servicio.categoria}">Categoria</span></span>
      <div class="card-title" th:text="${servicio.titulo}">Servicio</div>
      <p class="text-white small" th:text="${servicio.descripcion}">Descripcion</p>
    </div>
  </div>
</div>

<div class="form-section">
  <p class="hero-label">SOLICITUD</p>
  <h2 class="form-title">Solicitar servicio técnico</h2>
  <p class="form-subtitle">Completa los datos para enviar tu solicitud.</p>

  <div class="alert alert-success" th:if="${ok}">Solicitud enviada correctamente.</div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>

  <form th:action="@{/servicios/tecnico/solicitud}" th:object="${ticket}" method="post" id="ticketForm">
    <input type="hidden" name="supabaseUserId" th:value="${supabaseUserId}" id="supabaseUserId">
    <fieldset id="ticketFieldset">
      <div class="form-group">
        <label for="tec-nombre">Nombre</label>
        <input type="text" id="tec-nombre" th:field="*{nombre}" placeholder="Tu nombre" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tec-email">Email</label>
          <input type="email" id="tec-email" th:field="*{email}" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label for="tec-telefono">Teléfono</label>
          <input type="text" id="tec-telefono" th:field="*{telefono}" placeholder="612 345 678">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tec-equipo">Equipo</label>
          <input type="text" id="tec-equipo" th:field="*{equipo}" placeholder="Tipo de equipo">
        </div>
        <div class="form-group">
          <label for="tec-marca">Marca</label>
          <input type="text" id="tec-marca" th:field="*{marca}" placeholder="Marca del equipo">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tec-modelo">Modelo</label>
          <input type="text" id="tec-modelo" th:field="*{modelo}" placeholder="Modelo">
        </div>
        <div class="form-group">
          <label for="tec-serie">Número de serie</label>
          <input type="text" id="tec-serie" th:field="*{numeroSerie}" placeholder="Número de serie">
        </div>
      </div>

      <div class="form-group">
        <label for="tec-problema">Descripción del problema</label>
        <textarea id="tec-problema" th:field="*{descripcionProblema}" rows="5" placeholder="Describe el problema..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">
        <i class="bi bi-send"></i> Enviar solicitud
      </button>
    </fieldset>
  </form>
</div>
</main>

<div id="siteFooter" th:insert="~{Fragments/footerBlack :: footerBlack}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script src="/js/login-required.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
<script>
  const storedUserId = localStorage.getItem("supabaseUserId") || "";
  const supabaseInput = document.getElementById("supabaseUserId");
  const form = document.getElementById("ticketForm");
  const fieldset = document.getElementById("ticketFieldset");

  if (!storedUserId) {
    if (fieldset) fieldset.disabled = true;
    if (window.requireLogin) {
      setTimeout(function () {
        window.requireLogin();
      }, 100);
    }
  }

  // Si hay sesion precargamos los datos en readonly; si no, dejamos el form vacio.
  if (storedUserId && supabaseInput) {
    supabaseInput.value = storedUserId;
    fetch("/auth/profile?supabaseUserId=" + encodeURIComponent(storedUserId))
      .then(r => r.ok ? r.json() : null)
      .then(profile => {
        if (!profile) return;
        const setRO = (id, val) => {
          const el = document.getElementById(id);
          if (el && val) { el.value = val; el.readOnly = true; }
        };
        setRO("tec-nombre", (profile.nombre || "") + (profile.apellidos ? " " + profile.apellidos : ""));
        setRO("tec-email", profile.email);
        setRO("tec-telefono", profile.telefono);
      });
  }

  // El envio se valida por el popup global: si no hay sesion no se envia.
  if (form) {
    form.addEventListener("submit", function (e) {
      if (!window.requireLogin()) {
        e.preventDefault();
      }
    });
  }
</script>
</body>
</html>
