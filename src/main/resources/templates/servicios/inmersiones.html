<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inmersiones | Mourosub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container py-5" style="padding-top: 120px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold mb-0">Inmersiones</h1>
    <a class="btn btn-outline-light" th:href="@{/reservas/inmersiones}">Ver formulario</a>
  </div>
  <p class="text-muted mb-4">Catálogo dinámico de inmersiones activas. Las creadas en admin aparecen automáticamente.</p>

  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-4" th:each="inmersion : ${inmersiones}">
      <article class="card h-100 shadow-sm border-0">
        <img th:if="${inmersion.imagenUrl != null and !inmersion.imagenUrl.isEmpty()}" th:src="${inmersion.imagenUrl}" class="card-img-top" style="height:220px;object-fit:cover;" alt="Inmersión">
        <img th:unless="${inmersion.imagenUrl != null and !inmersion.imagenUrl.isEmpty()}" src="https://placehold.co/800x500/0b2138/00b4d8?text=Inmersion" class="card-img-top" style="height:220px;object-fit:cover;" alt="Inmersión">
        <div class="card-body d-flex flex-column">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="badge text-bg-info" th:text="${inmersion.ubicacion != null ? inmersion.ubicacion : 'Cantabria'}">Cantabria</span>
            <small class="text-muted" th:text="${inmersion.nivelReq != null ? inmersion.nivelReq : 'Todos los niveles'}">Todos los niveles</small>
          </div>
          <h5 class="card-title" th:text="${inmersion.nombre}">Nombre</h5>
          <p class="card-text text-muted" th:text="${inmersion.descripcion != null ? inmersion.descripcion : 'Inmersión guiada.'}">Descripción</p>
          <div class="mt-auto d-flex justify-content-between align-items-center">
            <strong th:text="${inmersion.precio != null ? #numbers.formatDecimal(inmersion.precio,1,2) + ' €' : '0.00 €'}">0.00 €</strong>
            <a class="btn btn-primary" th:href="@{/reservas/inmersiones(id=${inmersion.idInmersion})}">Reservar</a>
          </div>
        </div>
      </article>
    </div>
  </div>

  <div class="alert alert-secondary mt-4" th:if="${#lists.isEmpty(inmersiones)}">
    No hay inmersiones activas todavía.
  </div>
</main>

<div id="siteFooter" th:insert="~{fragments/footerBlack :: footerBlack}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script src="/js/reserva-prefill.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
