<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursos | Mourosub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div id="siteHeader" th:insert="~{Fragments/header :: siteHeader}"></div>

<main class="container py-5" style="padding-top: 120px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold mb-0">Cursos</h1>
    <a class="btn btn-outline-light" th:href="@{/reservas/cursos}">Ver formulario</a>
  </div>
  <p class="text-muted mb-4">Catálogo dinámico de cursos activos. Los nuevos cursos del panel admin aparecen aquí automáticamente.</p>

  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-4" th:each="curso : ${cursos}">
      <article class="card h-100 shadow-sm border-0">
        <img th:if="${curso.imagenUrl != null and !curso.imagenUrl.isEmpty()}" th:src="${curso.imagenUrl}" class="card-img-top" style="height:220px;object-fit:cover;" alt="Curso">
        <img th:unless="${curso.imagenUrl != null and !curso.imagenUrl.isEmpty()}" src="https://placehold.co/800x500/0b2138/00b4d8?text=Curso" class="card-img-top" style="height:220px;object-fit:cover;" alt="Curso">
        <div class="card-body d-flex flex-column">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="badge text-bg-info" th:text="${curso.categoria != null ? curso.categoria : 'General'}">General</span>
            <small class="text-muted" th:text="${curso.nivelRequerido != null ? curso.nivelRequerido : 'Sin nivel'}">Sin nivel</small>
          </div>
          <h5 class="card-title" th:text="${curso.nombre}">Nombre</h5>
          <p class="card-text text-muted" th:text="${curso.descripcion != null ? curso.descripcion : 'Curso de formación.'}">Descripción</p>
          <div class="mt-auto d-flex justify-content-between align-items-center">
            <strong th:text="${curso.precio != null ? #numbers.formatDecimal(curso.precio,1,2) + ' €' : '0.00 €'}">0.00 €</strong>
            <a class="btn btn-primary" th:href="@{/reservas/cursos(id=${curso.idCurso})}">Reservar</a>
          </div>
        </div>
      </article>
    </div>
  </div>

  <div class="alert alert-secondary mt-4" th:if="${#lists.isEmpty(cursos)}">
    No hay cursos activos todavía.
  </div>
</main>

<div id="siteFooter" th:insert="~{Fragments/footerBlack :: footerBlack}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<script src="/js/reserva-prefill.js"></script>
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
