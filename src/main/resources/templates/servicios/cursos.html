<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursos | Mourosub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<!-- Inserta el fragmento del header dentro del div #siteHeader (espaciador del header fijo) -->
<div id="siteHeader" th:insert="~{fragments/header :: siteHeader}"></div>

<main class="container py-5" style="padding-top: 120px;">
  <h1 class="fw-bold mb-3">Cursos</h1>
  <p class="text-muted">Base Thymeleaf inicial de cursos.</p>
</main>

<!-- Inserta el fragmento del footer -->
<div id="siteFooter" th:insert="~{fragments/footer :: footer}"></div>

<!-- Bootstrap (menu desplegable) y header.js (estado de sesion en el header) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/header.js"></script>
<!-- Activa el estado de sesion del header (icono de cuenta vs boton de login) -->
<script>if (window.initHeaderSession) window.initHeaderSession();</script>
</body>
</html>
