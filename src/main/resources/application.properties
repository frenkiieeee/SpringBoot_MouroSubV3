spring.application.name=Web

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://192.168.35.99:5433}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

spring.jpa.properties.hibernate.default_schema=public
# update: mantiene los datos
# create-drop: borra y crea la base de datos cada vez
# create: borra y crea la base de datos cada vez pero no borra los datos al finalizar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=false

# Recursos estaticos y plantillas.
# En Docker se montan desde el filesystem para ver los cambios del front sin reconstruir.
# Fuera de Docker se usa el classpath por defecto.
spring.web.resources.static-locations=${STATIC_LOCATIONS:classpath:/static/}
spring.web.resources.cache.period=0
spring.thymeleaf.prefix=${THYMELEAF_PREFIX:classpath:/templates/}
spring.thymeleaf.cache=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.seed.enabled=${APP_SEED_ENABLED:false}
